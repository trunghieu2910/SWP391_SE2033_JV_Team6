<div th:fragment="labResultsSection(session)" class="lab-results-card">

    <!-- Flash message thay cho react-hot-toast -->
    <div th:if="${success}" class="toast toast-success" th:text="${success}"></div>
    <div th:if="${error}" class="toast toast-error" th:text="${error}"></div>

    <button type="button" class="lab-results-header" onclick="this.parentElement.classList.toggle('open')">
        <span class="lab-icon">🧪</span>
        <span class="lab-title">Xét nghiệm y tế</span>
        <span class="lab-count" th:text="${#lists.size(session.labResults)}">0</span>
    </button>

    <div class="lab-results-body">
        <div th:if="${#lists.isEmpty(session.labResults)}" class="empty-text">
            Chưa có xét nghiệm nào
        </div>

        <div th:each="lab : ${session.labResults}" class="lab-result-item">
            <div class="lab-result-row">
                <div>
                    <p class="lab-test-type" th:text="${lab.testType}">Loại xét nghiệm</p>
                    <p class="lab-date" th:text="${#temporals.format(lab.createdAt, 'dd/MM/yyyy HH:mm')}">--</p>
                </div>

                <div class="lab-actions">
                    <!-- Chỉ hiện nút khi status = PENDING, tương đương lab.status === 'PENDING' -->
                    <form th:if="${lab.status.name() == 'PENDING'}"
                          th:action="@{/api/integration/lis/simulate/{sid}/{lid}(sid=${session.sessionId}, lid=${lab.labResultId})}"
                          method="post" class="inline-form">
                        <input type="hidden" name="testType" th:value="${lab.testType}" />
                        <button type="submit" class="btn-simulate-lis">Lấy kết quả LIS</button>
                    </form>

                    <span th:replace="~{layout/fragments/status-badge :: badge(${lab.status})}"></span>
                </div>
            </div>

            <div th:if="${!#lists.isEmpty(lab.parameters)}" class="lab-params">
                <div th:each="param : ${lab.parameters}" class="lab-param-row">
                    <span class="param-name" th:text="${param.parameter.parameterName}">--</span>
                    <span class="param-value">
                        <span th:text="${param.value}">--</span>
                        <span th:if="${param.parameter.unit}" th:text="${' ' + param.parameter.unit}"></span>
                    </span>
                </div>
            </div>
            <p th:if="${#lists.isEmpty(lab.parameters) and lab.status.name() == 'PENDING'}" class="empty-text-small">
                Chưa có kết quả chi tiết
            </p>
        </div>

        <a th:href="@{/doctor/sessions/{sid}/lab-results/add(sid=${session.sessionId})}" class="btn-add-lab">
            + Thêm xét nghiệm
        </a>
    </div>
</div>
