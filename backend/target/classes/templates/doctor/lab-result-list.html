<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{doctor/layout}">
<head><title>Kết quả xét nghiệm</title></head>
<body>
<div layout:fragment="content">

  <div class="page-header">
    <div>
      <h1 class="page-title">Kết quả xét nghiệm</h1>
      <p class="page-subtitle" th:if="${session != null}">
        Phiên khám #<span th:text="${session.sessionId}"></span> —
        <span th:text="${session.patient.user.fullName}"></span>
      </p>
    </div>
    <a th:href="@{/doctor/lab-results/create(sessionId=${sessionId})}"
       class="btn btn-primary">+ Thêm xét nghiệm</a>
  </div>

  <!-- Thông báo flash từ create() -->
  <div class="alert alert-success mb-4" th:if="${successMessage}" th:text="${successMessage}"></div>
  <div class="alert alert-error mb-4" th:if="${errorMessage}" th:text="${errorMessage}"></div>

  <div th:if="${#lists.isEmpty(labResults)}" class="empty-state">
    <span class="empty-state-icon">🔬</span>
    <h3>Chưa có xét nghiệm nào</h3>
    <p>Bấm "Thêm xét nghiệm" để tạo chỉ định mới cho phiên khám này.</p>
  </div>

  <details th:each="lab : ${labResults}" class="card mb-4" style="cursor:pointer;">
    <summary style="display:flex; align-items:center; justify-content:space-between; list-style:none;">
      <div style="display:flex; align-items:center; gap:14px;">
        <div style="width:40px;height:40px;border-radius:8px;background:rgba(59,130,246,0.1);
                            display:flex;align-items:center;justify-content:center;font-size:20px;">🔬</div>
        <div>
          <div style="font-weight:600;font-size:15px;color:var(--navy);" th:text="${lab.testType}"></div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">
            Mã XN: #<span th:text="${lab.labResultId}"></span> ·
            <span th:text="${#temporals.format(lab.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
          </div>
        </div>
      </div>

      <span th:switch="${lab.status.name()}">
                <span th:case="'PENDING'"   class="badge badge-yellow">Chờ xử lý</span>
                <span th:case="'COMPLETED'" class="badge badge-green">Hoàn thành</span>
                <span th:case="'CANCELED'"  class="badge badge-red">Đã hủy</span>
                <span th:case="*"           class="badge badge-gray" th:text="${lab.status}"></span>
            </span>
    </summary>

    <div style="margin-top:20px;border-top:1px solid var(--border);padding-top:20px;">
      <div th:if="${!#lists.isEmpty(lab.parameters)}" class="table-wrap">
        <table>
          <thead>
          <tr><th>#</th><th>Thông số</th><th>Đơn vị</th><th>Kết quả</th></tr>
          </thead>
          <tbody>
          <tr th:each="p, iter : ${lab.parameters}">
            <td th:text="${iter.count}" style="color:var(--text-muted);"></td>
            <td style="font-weight:500;" th:text="${p.parameterName}"></td>
            <td style="color:var(--text-muted);" th:text="${p.unit ?: '—'}"></td>
            <td style="font-weight:600;color:var(--navy);" th:text="${p.value}"></td>
          </tr>
          </tbody>
        </table>
      </div>
      <p th:if="${#lists.isEmpty(lab.parameters)}"
         style="color:var(--text-muted);font-size:14px;text-align:center;padding:12px 0;">
        Chưa có thông số xét nghiệm (đang chờ LIS trả kết quả)
      </p>
    </div>
  </details>

</div>
</body>
</html>
