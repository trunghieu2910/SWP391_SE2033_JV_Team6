<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{patient/layout :: main-layout(~{::main}, 'Hồ sơ cá nhân', 'profile')}">
<body>
<main>
    <link rel="stylesheet" th:href="@{/css/patient/profile.css}"/>

    <div class="page-shell">
        <div class="page-header">
            <div>
                <p class="eyebrow">Thông tin cá nhân</p>
                <h1>Quản lý hồ sơ của bạn</h1>
                <p class="subtext">Cập nhật thông tin để bác sĩ và hệ thống có thể phục vụ bạn tốt hơn.</p>
            </div>
            <a th:href="@{/patient/home}" class="back-btn">← Quay lại</a>
        </div>

        <div th:if="${success}" class="success-box">
            Cập nhật hồ sơ thành công.
        </div>

        <div class="content-grid">
            <section class="summary-card">
                <div class="avatar-large" th:text="${profile.fullName != null ? profile.fullName.substring(0,1).toUpperCase() : 'P'}">P</div>
                <h2 th:text="${profile.fullName != null ? profile.fullName : 'Chưa cập nhật'}">Tên bệnh nhân</h2>
                <p class="muted" th:text="${profile.email != null ? profile.email : 'Chưa có email'}">email@example.com</p>
                <div class="summary-list">
                    <div><span>Ngày sinh</span><strong th:text="${profile.dob != null ? #temporals.format(profile.dob, 'dd/MM/yyyy') : 'Chưa cập nhật'}"></strong></div>
                    <div><span>Số điện thoại</span><strong th:text="${profile.phoneNumber != null ? profile.phoneNumber : 'Chưa cập nhật'}"></strong></div>
                    <div><span>CCCD/CMND</span><strong th:text="${profile.nationalID != null ? profile.nationalID : 'Chưa cập nhật'}"></strong></div>
                </div>
            </section>

            <section class="form-card">
                <form th:action="@{/patient/profile}" th:object="${profileForm}" method="post" novalidate>
                    <div class="field-grid">
                        <div class="form-group">
                            <label for="username">Tên đăng nhập</label>
                            <input id="username" type="text" th:field="*{username}" class="form-input" readonly />
                            <div style="font-size:12px;color:#64748b;margin-top:6px;">Tên đăng nhập không thể thay đổi.</div>
                            <div class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>

                        <div class="form-group">
                            <label for="fullName">Họ và tên</label>
                            <input id="fullName" type="text" th:field="*{fullName}" class="form-input" required />
                            <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>

                        <div class="form-group">
                            <label for="phoneNumber">Số điện thoại</label>
                            <input id="phoneNumber" type="text" th:field="*{phoneNumber}" class="form-input" />
                            <div class="error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                        </div>

                        <div class="form-group">
                            <label for="nationalID">CCCD/CMND</label>
                            <input id="nationalID" type="text" th:field="*{nationalID}" class="form-input" />
                            <div class="error" th:if="${#fields.hasErrors('nationalID')}" th:errors="*{nationalID}"></div>
                        </div>

                        <div class="form-group">
                            <label for="gender">Giới tính</label>
                            <select id="gender" th:field="*{gender}" class="form-input">
                                <option value="">-- Chọn giới tính --</option>
                                <option value="Male">Nam</option>
                                <option value="Female">Nữ</option>
                                <option value="Other">Khác</option>
                            </select>
                            <div class="error" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
                        </div>

                        <div class="form-group">
                            <label for="dob">Ngày sinh (ngày/tháng/năm)</label>
                            <input id="dob" type="text" th:field="*{dob}" class="form-input" placeholder="dd/MM/yyyy"
                                   pattern="^(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[012])/[0-9]{4}$"
                                   title="Vui lòng nhập ngày sinh theo định dạng ngày/tháng/năm (ví dụ: 15/08/1995)" />
                            <div class="error" th:if="${#fields.hasErrors('dob')}" th:errors="*{dob}"></div>
                        </div>

                        <div class="form-group full-width">
                            <label for="address">Địa chỉ</label>
                            <textarea id="address" th:field="*{address}" class="form-input form-textarea"></textarea>
                            <div class="error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a th:href="@{/change-password}" class="btn-secondary" style="border: 1px solid #cbd5e1; background: white; color: #334155; margin-right: 12px;">Đổi mật khẩu</a>
                        <a th:href="@{/patient/home}" class="btn-secondary">Hủy</a>
                        <button type="submit" class="btn-primary" onclick="return confirm('Bạn có chắc chắn muốn lưu thay đổi hồ sơ này không?');">Lưu thay đổi</button>
                    </div>
                </form>
            </section>
        </div>
    </div>

    <!-- Flatpickr CSS & JS for elegant Vietnamese Calendar Date Picker -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/vn.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            flatpickr("#dob", {
                dateFormat: "d/m/Y",
                maxDate: "today",
                locale: "vn",
                allowInput: true
            });
        });
    </script>
</main>
</body>
</html>
