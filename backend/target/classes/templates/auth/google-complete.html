<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hoàn tất đăng ký - MedAI</title>
    <!-- CSRF token cho fetch() thuần JS -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="stylesheet" th:href="@{/css/auth/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth/login.css}">
</head>
<body>
<div class="login-page">
    <div class="login-left">
        <div class="login-left-content">
            <div class="login-logo"><span>+</span></div>
            <h1 class="login-app-name">MedAI</h1>
            <p class="login-tagline">Chỉ còn 1 bước nữa để hoàn tất tài khoản của bạn</p>
        </div>
    </div>

    <div class="login-right">
        <div class="login-card card">
            <div class="login-card-header">
                <h2>Bổ sung thông tin</h2>
                <p class="text-muted" id="welcomeText">
                    Chào mừng! Vui lòng cung cấp thêm thông tin để hoàn tất đăng ký.
                </p>
            </div>

            <div class="alert alert-error" id="errorBox" style="display:none;"></div>

            <form id="completeForm" onsubmit="return false;">
                <div class="form-group">
                    <label class="form-label" for="userName">Tên đăng nhập <span class="required">*</span></label>
                    <input id="userName" name="userName" class="form-input"
                           placeholder="Từ 3-50 ký tự" minlength="3" maxlength="50" required>
                </div>

                <div class="form-group mt-16">
                    <label class="form-label" for="phoneNumber">Số điện thoại <span class="required">*</span></label>
                    <input id="phoneNumber" name="phoneNumber" class="form-input"
                           placeholder="10 chữ số" pattern="\d{10}" required>
                </div>

                <div class="form-group mt-16">
                    <label class="form-label" for="nationalID">Số CCCD <span class="required">*</span></label>
                    <input id="nationalID" name="nationalID" class="form-input"
                           placeholder="Đúng 12 chữ số" pattern="\d{12}" minlength="12" maxlength="12" required>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary btn-full mt-24">
                    Hoàn tất đăng ký
                </button>
            </form>

            <div class="login-forgot-row" style="justify-content:center;margin-top:18px">
                <a th:href="@{/auth/login}" class="login-forgot-link">← Quay lại trang đăng nhập</a>
            </div>
        </div>
    </div>
</div>

<script type="module" th:src="@{/js/auth/google-complete.js}"></script>
</body>
</html>
