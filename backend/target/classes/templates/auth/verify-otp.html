<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xác thực OTP</title>
    <link rel="stylesheet" th:href="@{/css/auth/auth.css}" />
</head>
<body>
<div class="login-page">
    <div class="login-left">
        <div class="login-left-content">
            <div class="login-logo">+</div>
            <h1 class="login-app-name">MedAI</h1>
            <p class="login-tagline">Hệ thống sàng lọc ung thư cổ tử cung hỗ trợ bởi trí tuệ nhân tạo</p>
            <div class="decor-circle c1"></div>
            <div class="decor-circle c2"></div>
            <div class="decor-circle c3"></div>
        </div>
    </div>
    <div class="login-right">
        <div class="login-card card">
            <div class="login-card-header">
                <h2>Kích hoạt tài khoản</h2>
                <p>Nhập mã OTP đã gửi tới email để kích hoạt tài khoản.</p>
            </div>

            <div th:if="${successMessage}" class="alert alert-success">
                <span>✓</span>
                <span th:text="${successMessage}"></span>
            </div>
            <div th:if="${error}" class="alert alert-error">
                <span>!</span>
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/auth/register/verify-otp}" th:object="${otpRequest}" method="post">
                <!-- Ẩn username -->
                <input type="hidden" id="userName" th:field="*{userName}" />

                <div class="form-group">
                    <label class="form-label" style="text-align: center; margin-bottom: 15px;">Mã OTP (6 chữ số)</label>
                    <div class="otp-inputs" style="display: flex; gap: 10px; justify-content: center; margin-bottom: 10px;">
                        <input type="text" maxlength="1" class="otp-box form-control" style="width: 45px; height: 45px; text-align: center; font-size: 1.2rem; font-weight: bold; border-radius: 8px; padding: 0;" />
                        <input type="text" maxlength="1" class="otp-box form-control" style="width: 45px; height: 45px; text-align: center; font-size: 1.2rem; font-weight: bold; border-radius: 8px; padding: 0;" />
                        <input type="text" maxlength="1" class="otp-box form-control" style="width: 45px; height: 45px; text-align: center; font-size: 1.2rem; font-weight: bold; border-radius: 8px; padding: 0;" />
                        <input type="text" maxlength="1" class="otp-box form-control" style="width: 45px; height: 45px; text-align: center; font-size: 1.2rem; font-weight: bold; border-radius: 8px; padding: 0;" />
                        <input type="text" maxlength="1" class="otp-box form-control" style="width: 45px; height: 45px; text-align: center; font-size: 1.2rem; font-weight: bold; border-radius: 8px; padding: 0;" />
                        <input type="text" maxlength="1" class="otp-box form-control" style="width: 45px; height: 45px; text-align: center; font-size: 1.2rem; font-weight: bold; border-radius: 8px; padding: 0;" />
                    </div>
                    <!-- Hidden field thực sự map với DTO -->
                    <input type="hidden" id="otp" th:field="*{otp}" />
                    <p th:if="${#fields.hasErrors('otp')}" class="field-error" style="text-align: center;" th:errors="*{otp}"></p>
                </div>
                <button type="submit" class="btn btn-primary" onclick="gatherOtp()">Xác thực</button>
            </form>

            <script>
                const inputs = document.querySelectorAll('.otp-box');
                const hiddenOtp = document.getElementById('otp');

                // Nếu có giá trị cũ (lúc validate lỗi), điền lại vào các ô
                if (hiddenOtp.value) {
                    for (let i = 0; i < hiddenOtp.value.length && i < inputs.length; i++) {
                        inputs[i].value = hiddenOtp.value[i];
                    }
                }

                inputs.forEach((input, index) => {
                    input.addEventListener('input', (e) => {
                        // Chỉ cho phép nhập số
                        e.target.value = e.target.value.replace(/[^0-9]/g, '');
                        if (e.target.value.length === 1 && index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        }
                        updateHiddenOtp();
                    });

                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                            inputs[index - 1].focus();
                        }
                    });
                });

                function updateHiddenOtp() {
                    let otpVal = '';
                    inputs.forEach(input => {
                        otpVal += input.value;
                    });
                    hiddenOtp.value = otpVal;
                }
                
                function gatherOtp() {
                    updateHiddenOtp();
                    return true;
                }
            </script>
            <div class="login-action-row">
                <a class="login-forgot-link" th:href="@{/auth/register/resend-otp(userName=${otpRequest.userName})}">Gửi lại OTP</a>
                <a class="login-forgot-link" th:href="@{/auth/login}">Quay về đăng nhập</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
