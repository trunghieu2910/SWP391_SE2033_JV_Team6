# ===== THYMELEAF =====
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

## ===== DEVTOOLS =====
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ===== STATIC RESOURCES =====
spring.web.resources.cache.period=0
spring.web.resources.cache.use-last-modified=false

# ================================================================
# ===== TOMCAT CONFIG - FIX ERR_INCOMPLETE_CHUNKED_ENCODING =====
# ================================================================

# TĂNG TIMEOUT
server.tomcat.connection-timeout=180000
server.tomcat.keep-alive-timeout=180000

# TĂNG KÍCH THƯỚC HEADER VÀ POST
server.tomcat.max-http-header-size=2097152
server.tomcat.max-http-form-post-size=2097152

# TĂNG THREAD POOL
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100

# TẮT COMPRESSION - QUAN TRỌNG
server.compression.enabled=false

# TẮT SEND FILE (giúp tránh lỗi chunked encoding)
server.tomcat.sendfile=false

# TĂNG BUFFER CHO RESPONSE
server.tomcat.buffer-size=131072

# ================================================================
# ===== JPA PERFORMANCE - GIỚI HẠN DỮ LIỆU =====
# ================================================================

# Giới hạn kết quả query mặc định
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50

# Hibernate batch size
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Giới hạn fetch size
spring.jpa.properties.hibernate.jdbc.fetch_size=100

# ================================================================
# ===== LOGGING =====
# ================================================================

# Log level cho Tomcat và Spring Web
logging.level.org.springframework.web=DEBUG
logging.level.org.apache.catalina=DEBUG
logging.level.org.apache.tomcat=DEBUG
logging.level.org.springframework.boot.devtools=DEBUG

# Log level cho Hibernate
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Log level cho lỗi chunked encoding
logging.level.org.apache.coyote.http11=DEBUG

# Tắt log tcnative warning
logging.level.org.apache.catalina.core.AprLifecycleListener=ERROR
logging.level.org.apache.tomcat.jni.Library=ERROR

logging.level.org.apache.coyote.http11.Http11Processor=ERROR
logging.level.org.apache.tomcat.util.net.NioEndpoint=ERROR
logging.level.org.apache.catalina.connector=ERROR
