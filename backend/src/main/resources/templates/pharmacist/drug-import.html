<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{pharmacist/layout :: main-layout(~{::main}, 'Nhập kho thuốc', 'import')}">
<body>
<main>
    <link rel="stylesheet" th:href="@{/css/pharmacist/drug-import.css}">
    <div class="container">
        <header class="page-header" style="margin-bottom: 24px;">
            <h1><i class="fas fa-file-import"></i> Tạo phiếu nhập kho mới</h1>
            <a href="/pharmacist/import-history" class="btn btn-secondary">
                <i class="fas fa-history"></i> Lịch sử nhập kho
            </a>
        </header>

        <form th:action="@{/pharmacist/drug-import}" method="post" class="form-container" style="max-width: 800px; margin: 0 auto;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group" style="position: relative;">
                <label for="drugId">Chọn thuốc cần nhập *</label>
                <div class="custom-select-wrapper" id="drugSelectWrapper">
                    <div class="custom-select-trigger" id="drugSelectTrigger" onclick="toggleDrugDropdown()">
                        <span id="selectedDrugText">-- Chọn thuốc --</span>
                        <i class="fas fa-chevron-down"></i>
                    </div>
                    <div class="custom-select-dropdown" id="drugDropdownPanel" style="display: none;">
                        <div class="custom-select-search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="customDrugSearch" placeholder="Tìm tên thuốc, mã thuốc..." oninput="filterDrugOptions()">
                        </div>
                        <ul class="custom-select-options" id="customSelectOptionsList">
                            <li class="custom-select-option" data-value="" onclick="selectDrugOption(this, '', '', '')">-- Chọn thuốc --</li>
                            <li th:each="d : ${drugs}" 
                                class="custom-select-option" 
                                th:data-value="${d.drugId}"
                                th:data-code="${d.drugCode}"
                                th:data-name="${d.drugName}"
                                th:onclick="selectDrugOption(this, [[${d.drugId}]], [[${d.drugName}]], [[${d.drugCode}]])">
                                <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                                    <div>
                                        <strong th:text="${d.drugName}" style="color: var(--neutral-dark);"></strong>
                                        <span th:text="' (' + ${d.strength} + ' ' + ${d.strengthUnit} + ')'" style="font-size: 0.8rem; color: var(--neutral-light);"></span>
                                    </div>
                                    <span class="badge badge-info" th:text="${d.drugCode}" style="font-size: 0.75rem;"></span>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
                <!-- Hidden input that actually binds to the form model -->
                <input type="hidden" id="drugId" name="drugId" required>
            </div>

            <div class="form-group">
                <label for="batchNumber">Số lô (Lot Number) * (Tự động tạo)</label>
                <input type="text" id="batchNumber" name="batchNumber" required readonly style="background-color: #f1f5f9; color: #64748b; cursor: not-allowed;" placeholder="Hệ thống tự động tạo khi chọn thuốc">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="manufactureDate">Ngày sản xuất *</label>
                    <input type="date" id="manufactureDate" name="manufactureDate" required>
                </div>
                <div class="form-group">
                    <label for="expiryDate">Hạn sử dụng (Expiry Date) *</label>
                    <input type="date" id="expiryDate" name="expiryDate" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="unitId">Đơn vị nhập *</label>
                    <select id="unitId" name="unitId" required>
                        <option value="">-- Chọn đơn vị --</option>
                        <option th:each="u : ${units}" th:value="${u.unitId}" th:text="${u.unitName}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="quantity">Số lượng nhập *</label>
                    <input type="number" id="quantity" name="quantity" min="1" required placeholder="Nhập số lượng nguyên dương">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="importPrice">Đơn giá nhập (VNĐ) *</label>
                    <input type="number" id="importPrice" name="importPrice" min="1" required placeholder="Ví dụ: 150000">
                </div>
                <div class="form-group">
                    <label for="supplier">Nhà cung cấp (Supplier) *</label>
                    <input type="text" id="supplier" name="supplier" required placeholder="Tên nhà cung cấp hoặc hãng phân phối">
                </div>
            </div>

            <div class="form-group">
                <label for="notes">Ghi chú nhập kho</label>
                <textarea id="notes" name="notes" rows="3" placeholder="Thông tin bổ sung về lô hàng nhập kho..."></textarea>
            </div>

            <div class="form-actions" style="display: flex; gap: 12px; margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 24px;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">
                    <i class="fas fa-file-import"></i> Thực hiện nhập kho
                </button>
                <a href="/pharmacist/dashboard" class="btn btn-secondary" style="flex: 1; text-align: center;">
                    Hủy bỏ
                </a>
            </div>
        </form>
    </div>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const nextBatchStt = [[${nextBatchStt}]];
        /*]]>*/
    </script>
    <script th:src="@{/js/pharmacist/drug-import.js}"></script>
</main>
</body>
</html>
