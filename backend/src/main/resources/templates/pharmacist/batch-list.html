<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{pharmacist/layout :: main-layout(~{::main}, 'Quản lý lô hàng', 'batch-list')}">
<body>
<main>
    <link rel="stylesheet" th:href="@{/css/pharmacist/batch-list.css}">

    <div class="container">
        <header class="page-header" style="margin-bottom: 24px;">
            <h1><i class="fas fa-boxes-stacked"></i> Quản lý lô hàng</h1>
            <a href="/pharmacist/drug-import" class="btn btn-primary">
                <i class="fas fa-plus"></i> Nhập lô hàng mới
            </a>
        </header>

        <section class="card" style="padding: 0; overflow: hidden;">
            <div style="padding: 24px 24px 12px 24px;">
                <div class="batch-list-toolbar">
                    <div class="batch-list-search">
                        <i class="fas fa-search"></i>
                        <input type="text" id="importHistorySearchInput" placeholder="Tìm theo tên thuốc hoặc số lô thuốc">
                    </div>
                    <div class="batch-list-sort">
                        <i class="fas fa-arrow-up-wide-short"></i>
                        <select id="importHistorySortSelect">
                            <option value="">-- Sắp xếp --</option>
                            <option value="expiry-desc">Hạn sử dụng: lớn đến bé</option>
                            <option value="expiry-asc">Hạn sử dụng: bé đến lớn</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="table-responsive" style="margin-top: 0;">
            <table class="table">
                <thead>
                    <tr>
                        <th>Thuốc</th>
                        <th>Số lô</th>
                        <th>Ngày SX</th>
                        <th>HSD</th>
                        <th>Nhà cung cấp</th>
                        <th>Thời gian nhập</th>
                        <th>Trạng thái</th>
                    </tr>
                </thead>
                <tbody id="importHistoryTableBody">
                    <tr th:each="batch : ${batches}" th:onclick="viewBatchDetail([[${batch.batchId}]])" style="cursor: pointer;">
                        <td th:text="${batch.drugName}" style="font-weight: 700; color: var(--primary);">-</td>
                        <td th:text="${batch.batchNumber}" style="font-weight: 600;">-</td>
                        <td th:text="${#temporals.format(batch.manufactureDate, 'dd/MM/yyyy')}">-</td>
                        <td th:text="${#temporals.format(batch.expiryDate, 'dd/MM/yyyy')}">-</td>
                        <td th:text="${batch.supplier}">-</td>
                        <td th:text="${#temporals.format(batch.importDate, 'dd/MM/yyyy HH:mm')}">-</td>
                        <td>
                            <span th:if="${batch.status != null and batch.status.name() == 'ACTIVE'}" class="badge badge-success">Sẵn dùng</span>
                            <span th:if="${batch.status != null and batch.status.name() == 'EXPIRED'}" class="badge badge-warning" style="background-color: #eab308; color: white;">Hết hạn</span>
                            <span th:if="${batch.status != null and batch.status.name() == 'INACTIVE'}" class="badge badge-danger">Ngừng</span>
                        </td>
                    </tr>
                    <tr id="importHistoryEmptyRow" style="display: none;">
                        <td colspan="7" style="text-align: center; color: var(--neutral-light); padding: 32px;">
                            Không tìm thấy thuốc hoặc số lô phù hợp.
                        </td>
                    </tr>
                    <tr th:if="${batches == null or #lists.isEmpty(batches.content)}">
                        <td colspan="7" style="text-align: center; color: var(--neutral-light); padding: 32px;">
                            Chưa có bản ghi nhập kho nào.
                        </td>
                    </tr>
                </tbody>
            </table>
            </div>
        </section>

        <!-- Phân trang -->
        <nav th:if="${totalPages > 1}" class="pagination">
            <ul>
                <li th:if="${currentPage > 0}">
                    <a th:href="@{/pharmacist/batch-list(page=${currentPage-1})}">Trước</a>
                </li>
                <li th:each="i : ${#numbers.sequence(0, totalPages-1)}" 
                    th:classappend="${i == currentPage} ? 'active'">
                    <a th:href="@{/pharmacist/batch-list(page=${i})}" th:text="${i+1}">1</a>
                </li>
                <li th:if="${currentPage < totalPages-1}">
                    <a th:href="@{/pharmacist/batch-list(page=${currentPage+1})}">Sau</a>
                </li>
            </ul>
        </nav>
    </div>

    <script th:src="@{/js/pharmacist/batch-list.js}"></script>
</main>
</body>
</html>
