<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{pharmacist/layout :: main-layout(~{::main}, 'Hồ sơ cá nhân', 'profile')}">
<body>
<main>
    <!-- We can reuse patient/profile.css for consistent visual layout or write our own, let's link the profile css -->
    <link rel="stylesheet" th:href="@{/css/patient/profile.css}"/>
    
    <!-- Thông báo thành công / l?i -->
    <div th:if="${success}" style="background:#ecfdf5;border:1px solid #10b981;color:#065f46;padding:14px 18px;border-radius:8px;margin-bottom:20px;font-weight:600;display:flex;align-items:center;gap:10px;">
        <i class="fas fa-check-circle"></i> Thay đổi thông tin cá nhân thành công.
    </div>
    <div th:if="${error}" style="background:#fef2f2;border:1px solid #ef4444;color:#991b1b;padding:14px 18px;border-radius:8px;margin-bottom:20px;font-weight:600;display:flex;align-items:center;gap:10px;">
        <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
    </div>

    <div class="content-grid" style="display: grid; grid-template-columns: 1fr 2fr; gap: 24px; margin-top: 20px;">
        <section class="summary-card" style="background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; align-items: center; text-align: center;">
            <div class="avatar-large" style="width: 96px; height: 96px; border-radius: 50%; background: #e0f2fe; color: #0284c7; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: bold; margin-bottom: 16px;" th:text="${profile.fullName != null ? profile.fullName.substring(0,1).toUpperCase() : 'P'}">P</div>
            <h2 style="font-size: 20px; font-weight: 700; color: #1e293b; margin-bottom: 4px;" th:text="${profile.fullName != null ? profile.fullName : 'Chưa cập nhật'}">Họ tên dược sĩ</h2>
            <p class="muted" style="color: #64748b; font-size: 14px; margin-bottom: 24px;" th:text="${profile.email != null ? profile.email : 'Chưa có email'}">email@example.com</p>
            <div class="summary-list" style="width: 100%; border-top: 1px solid #f1f5f9; padding-top: 16px; text-align: left;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px;"><span style="color: #64748b;">Số điện thoại</span><strong style="color: #0f172a;" th:text="${profile.phoneNumber != null ? profile.phoneNumber : 'Chưa cập nhật'}"></strong></div>
                <div style="display: flex; justify-content: space-between; font-size: 14px;"><span style="color: #64748b;">CCCD/CMND</span><strong style="color: #0f172a;" th:text="${profile.nationalID != null ? profile.nationalID : 'Chưa cập nhật'}"></strong></div>
            </div>
        </section>

        <section class="form-card" style="background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
            <form th:action="@{/pharmacist/profile}" th:object="${profileForm}" method="post" novalidate>
                <div class="field-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 14px; color: #334155;" for="username">Tên đăng nhập</label>
                        <input style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; background: #f8fafc;" id="username" type="text" th:field="*{username}" class="form-input" readonly />
                        <div style="font-size:12px;color:#64748b;">Tên đăng nhập không thể thay đổi.</div>
                    </div>

                    <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 14px; color: #334155;" for="fullName">Họ và tên</label>
                        <input style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;" id="fullName" type="text" th:field="*{fullName}" class="form-input" required />
                        <div class="error" style="color: #ef4444; font-size: 12px;" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>

                    <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 14px; color: #334155;" for="phoneNumber">Số điện thoại</label>
                        <input style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;" id="phoneNumber" type="text" th:field="*{phoneNumber}" class="form-input" />
                        <div class="error" style="color: #ef4444; font-size: 12px;" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                    </div>

                    <div class="form-group" style="display: flex; flex-direction: column; gap: 6px;">
                        <label style="font-weight: 600; font-size: 14px; color: #334155;" for="nationalID">CCCD/CMND</label>
                        <input style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;" id="nationalID" type="text" th:field="*{nationalID}" class="form-input" />
                        <div class="error" style="color: #ef4444; font-size: 12px;" th:if="${#fields.hasErrors('nationalID')}" th:errors="*{nationalID}"></div>
                    </div>
                </div>

                <div class="form-actions" style="margin-top: 24px; display: flex; justify-content: flex-end; gap: 12px;">
                    <a th:href="@{/change-password}" class="btn-action" style="padding: 10px 20px; font-weight: 600; border-radius: 6px; border: 1px solid #cbd5e1; background: white; color: #334155; text-decoration: none; display: inline-block; cursor: pointer;">Đổi mật khẩu</a>
                    <button type="submit" class="btn-action btn-primary" style="padding: 10px 20px; font-weight: 600; border-radius: 6px; border: none; background: #0f766e; color: white; cursor: pointer;" onclick="return confirm('Bạn có chắc chắn muốn lưu thay đổi hồ sơ này không?');">Lưu thay đổi</button>
                </div>
            </form>
        </section>
    </div>
</main>
</body>
</html>
