<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{pharmacist/layout :: main-layout(~{::main}, 'Danh sách cấp phát thuốc', 'dispense')}">
<body>
<main>
    <div class="container">
        <header class="page-header" style="margin-bottom: 24px;">
            <h1><i class="fas fa-hand-holding-medical"></i> Đơn thuốc chờ dược sĩ cấp phát</h1>
        </header>

        <section class="card" style="padding: 0; overflow: hidden;">
            <div class="table-responsive" style="margin-top: 0;">
            <table class="table">
                <thead>
                    <tr>
                        <th>Mã đơn thuốc</th>
                        <th>Bệnh nhân</th>
                        <th>Tên thuốc</th>
                        <th>Liều dùng hàng ngày</th>
                        <th>Số lượng kê</th>
                        <th>Số lượng còn</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="prescription : ${prescriptions}">
                        <td th:text="${prescription.prescriptionCode}" style="font-weight: 700; color: var(--neutral-dark);">-</td>
                        <td th:text="${prescription.patientName}" style="font-weight: 600;">-</td>
                        <td th:text="${prescription.drugName}" style="color: var(--primary); font-weight: 700;">-</td>
                        <td th:text="${prescription.dosePerTime} + ' mg, ' + ${prescription.timesPerDay} + ' lần/ngày'">-</td>
                        <td th:text="${prescription.quantityPrescribed}" style="font-weight: 700;">-</td>
                        <td th:text="${prescription.quantityPrescribed - (prescription.quantityDispensed != null ? prescription.quantityDispensed : 0)}" style="font-weight: 700; color: #b45309;">-</td>
                        <td>
                            <span th:if="${prescription.isPending}" class="badge badge-warning">Chờ cấp phát</span>
                            <span th:if="!${prescription.isPending}" class="badge badge-success">Đã cấp phát</span>
                        </td>
                        <td>
                            <a th:href="@{/pharmacist/dispense-form/{id}(id=${prescription.detailId})}" 
                               class="btn btn-sm btn-primary" th:if="${prescription.isPending}">
                                <i class="fas fa-plus"></i> Cấp phát
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(prescriptions.content)}">
                        <td colspan="8" style="text-align: center; color: var(--neutral-light); padding: 32px;">
                            <i class="fas fa-check-circle" style="font-size: 2rem; color: var(--success); display: block; margin-bottom: 8px;"></i>
                            Không có đơn thuốc nào đang chờ cấp phát.
                        </td>
                    </tr>
                </tbody>
            </table>
            </div>
        </section>

        <!-- Pagination -->
        <nav th:if="${totalPages > 1}" class="pagination">
            <ul>
                <li th:if="${currentPage > 0}">
                    <a th:href="@{/pharmacist/dispense-list(page=${currentPage-1})}">Trước</a>
                </li>
                <li th:each="i : ${#numbers.sequence(0, totalPages-1)}" 
                    th:classappend="${i == currentPage} ? 'active'">
                    <a th:href="@{/pharmacist/dispense-list(page=${i})}" th:text="${i+1}">1</a>
                </li>
                <li th:if="${currentPage < totalPages-1}">
                    <a th:href="@{/pharmacist/dispense-list(page=${currentPage+1})}">Sau</a>
                </li>
            </ul>
        </nav>
    </div>

    <script th:src="@{/js/pharmacist/dispense-list.js}"></script>
</main>
</body>
</html>
