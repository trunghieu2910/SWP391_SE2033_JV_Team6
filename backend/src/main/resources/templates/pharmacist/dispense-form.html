<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{pharmacist/layout :: main-layout(~{::main}, 'Cấp phát thuốc', 'dispense')}">
<body>
<main>
    <div class="container">
        <!-- X? lý l?i n?u chi ti?t b? null -->
        <div th:if="${detail == null}" style="background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; padding: 16px; border-radius: 4px; margin-bottom: 20px;">
            <strong>Lỗi:</strong> Không tìm thấy thông tin chi tiết đơn thuốc. 
            <a href="/pharmacist/dispense-list" class="btn btn-secondary" style="margin-top: 10px; display: inline-block;">Quay lại danh sách</a>
        </div>

        <th:block th:if="${detail != null}">
        <header class="page-header" style="margin-bottom: 24px;">
            <a th:href="@{/pharmacist/dispense-prescription/{id}(id=${detail.prescriptionId})}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Quay lại chi tiết đơn thuốc
            </a>
        </header>

        <!-- Th? thông tin lu?i Ðon thu?c -->
        <section class="prescription-info card" style="margin-bottom: 24px;">
            <div style="border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 20px;">
                <h2 style="font-size: 1.15rem; font-weight: 800; color: var(--neutral-dark);">Chi tiết đơn thuốc kê đơn</h2>
            </div>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <span style="font-size: 0.78rem; text-transform: uppercase; font-weight: 700; color: var(--neutral-light);">Mã đơn thuốc</span>
                    <strong th:text="${detail.prescriptionCode}" style="font-size: 0.95rem; color: var(--neutral-dark);">-</strong>
                </div>
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <span style="font-size: 0.78rem; text-transform: uppercase; font-weight: 700; color: var(--neutral-light);">Bệnh nhân</span>
                    <strong th:text="${detail.patientName}" style="font-size: 0.95rem; color: var(--neutral-dark);">-</strong>
                </div>
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <span style="font-size: 0.78rem; text-transform: uppercase; font-weight: 700; color: var(--neutral-light);">Tên thuốc</span>
                    <strong th:text="${detail.drugName}" style="font-size: 0.95rem; color: var(--primary); font-weight: 800;">-</strong>
                </div>
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <span style="font-size: 0.78rem; text-transform: uppercase; font-weight: 700; color: var(--neutral-light);">Liều dùng</span>
                    <strong th:text="${detail.dosePerTime} + ' mg, ' + ${detail.timesPerDay} + ' lần/ngày'" style="font-size: 0.95rem; color: var(--neutral-dark);">-</strong>
                </div>
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <span style="font-size: 0.78rem; text-transform: uppercase; font-weight: 700; color: var(--neutral-light);">Thời gian sử dụng</span>
                    <strong th:text="${detail.daysOfTreatment} + ' ngày'" style="font-size: 0.95rem; color: var(--neutral-dark);">-</strong>
                </div>
                <div style="display: flex; flex-direction: column; gap: 4px;">
                    <span style="font-size: 0.78rem; text-transform: uppercase; font-weight: 700; color: var(--neutral-light);">Số lượng kê đơn</span>
                    <strong th:text="${detail.quantityPrescribed}" style="font-size: 0.95rem; color: var(--neutral-dark); font-weight: 700;">-</strong>
                </div>
            </div>
            
            <div style="margin-top: 16px; padding: 12px; background-color: var(--primary-bg); border-radius: var(--radius); border-left: 4px solid var(--primary); font-size: 0.9rem;">
                <strong>Chỉ dẫn bác sĩ:</strong> <span th:text="${detail.instruction}">-</span>
            </div>
        </section>

        <!-- Form c?p phát thu?c -->
        <form th:action="@{/pharmacist/drug-dispense}" method="post" class="form-container" style="max-width: 600px; margin: 0 auto;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="detailId" th:value="${detail?.detailId}">
            <input type="hidden" id="drugId" name="drugIdField" th:value="${detail?.drugId}" th:data-drug-id="${detail?.drugId}">

            <!-- Debug: Hi?n th? giá tr? drugId -->
            <div style="background: #fff3cd; border: 1px solid #ffc107; padding: 12px; margin-bottom: 16px; border-radius: 4px; display: none;" id="debugInfo">
                <small>DEBUG: drugId = <span id="debugDrugId">loading...</span></small>
            </div>

            <div class="form-group">
                <label for="actionStatus">Trạng thái xử lý *</label>
                <select id="actionStatus" name="actionStatus" onchange="toggleDispenseActionFields()" style="font-weight: 700; color: var(--neutral-dark);">
                    <option value="DISPENSED" selected>Cấp phát thuốc (Cấp phát)</option>
                    <option value="CANCELLED">Hủy cấp phát (Hủy)</option>
                </select>
            </div>

            <div id="dispenseFieldsContainer">
                <div class="form-group">
                    <label for="batchId">Chọn lô hàng còn hạn & còn hàng *</label>
                    <select id="batchId" name="batchId" required onchange="updateBatchInfo()">
                        <option value="">-- Đang tải dữ liệu --</option>
                    </select>
                </div>

                <!-- Các b?ng thông tin Lô hàng d?ng -->
                <div class="form-group" id="batchInfoGroup" style="display: none; background: #f8fafc; border: 1px solid var(--border-color); padding: 16px; border-radius: var(--radius); margin-bottom: 20px;">
                    <label style="margin-bottom: 8px; display: block; font-weight: 700; font-size: 0.82rem; text-transform: uppercase; color: var(--neutral-light);">Chi tiết lô đã chọn</label>
                    <div style="display: flex; gap: 32px;">
                        <div>
                            <span style="font-size: 0.85rem; color: var(--neutral-light);">Hạn sử dụng:</span>
                            <strong id="expiryDate" style="display: block; margin-top: 4px; font-size: 0.95rem; color: #b45309;">-</strong>
                        </div>
                        <div>
                            <span style="font-size: 0.85rem; color: var(--neutral-light);">Số lượng tồn:</span>
                            <strong id="stockQuantity" style="display: block; margin-top: 4px; font-size: 0.95rem; color: var(--primary);">-</strong>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="quantityDispensed">Số lượng cấp phát thực tế *</label>
                    <input type="number" id="quantityDispensed" name="quantityDispensed" 
                           min="1" th:value="${detail?.quantityPrescribed}" required placeholder="Số lượng xuất kho">
                </div>
            </div>

            <div class="form-group">
                <label for="notes" id="notesLabel">Ghi chú cấp phát</label>
                <textarea id="notes" name="notes" rows="3" placeholder="Ví dụ: Đã hướng dẫn kỹ cách dùng cho bệnh nhân"></textarea>
            </div>

            <div class="form-actions" style="display: flex; gap: 12px; margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 24px;">
                <button type="submit" id="submitBtn" class="btn btn-primary" style="flex: 1;">
                    <i class="fas fa-check-circle"></i> Xác nhận cấp phát
                </button>
                <a th:href="@{/pharmacist/dispense-prescription/{id}(id=${detail.prescriptionId})}" class="btn btn-secondary" style="flex: 1; text-align: center;">
                    Quay lại
                </a>
            </div>
        </form>
        </th:block>
    </div>

    <script th:src="@{/js/pharmacist/dispense-form.js}"></script>
    <script>
        function toggleDispenseActionFields() {
            const status = document.getElementById('actionStatus').value;
            const container = document.getElementById('dispenseFieldsContainer');
            const batchId = document.getElementById('batchId');
            const qtyInput = document.getElementById('quantityDispensed');
            const notesLabel = document.getElementById('notesLabel');
            const notesInput = document.getElementById('notes');
            const submitBtn = document.getElementById('submitBtn');

            if (status === 'CANCELLED') {
                container.style.display = 'none';
                batchId.removeAttribute('required');
                qtyInput.removeAttribute('required');
                notesLabel.innerHTML = 'Ghi chú (Lý do hủy) <span style="color: red;">*</span>';
                notesInput.setAttribute('required', 'required');
                notesInput.placeholder = 'Bắt buộc nhập lý do hủy cấp phát thuốc này...';
                submitBtn.className = 'btn btn-danger';
                submitBtn.style.backgroundColor = '#dc2626';
                submitBtn.style.borderColor = '#dc2626';
                submitBtn.innerHTML = '<i class="fas fa-ban"></i> Xác nhận hủy cấp phát';
            } else {
                container.style.display = 'block';
                batchId.setAttribute('required', 'required');
                qtyInput.setAttribute('required', 'required');
                notesLabel.innerHTML = 'Ghi chú cấp phát';
                notesInput.removeAttribute('required');
                notesInput.placeholder = 'Ví dụ: Đã hướng dẫn kỹ cách dùng cho bệnh nhân';
                submitBtn.className = 'btn btn-primary';
                submitBtn.style.backgroundColor = '';
                submitBtn.style.borderColor = '';
                submitBtn.innerHTML = '<i class="fas fa-check-circle"></i> Xác nhận cấp phát';
            }
        }

        // Override JS updateBatchInfo to toggle info card visibility
        const originalUpdateBatchInfo = updateBatchInfo;
        updateBatchInfo = function() {
            originalUpdateBatchInfo();
            const batchId = document.getElementById('batchId').value;
            const infoGroup = document.getElementById('batchInfoGroup');
            if (batchId) {
                infoGroup.style.display = 'block';
            } else {
                infoGroup.style.display = 'none';
            }
        };
    </script>
</main>
</body>
</html>
