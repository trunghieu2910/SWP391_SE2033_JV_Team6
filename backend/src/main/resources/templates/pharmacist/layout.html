<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="main-layout(content, title, currentTab)" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Dược sĩ | Cervical Dx'">Dược sĩ | Cervical Dx</title>
    <meta th:name="${_csrf.parameterName}" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <!-- Base Layout CSS -->
    <link rel="stylesheet" th:href="@{/css/pharmacist/layout.css}">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-house-medical"></i>
            <h2>MedAI Pharm</h2>
        </div>
        <nav class="sidebar-nav">
            <a th:href="@{/pharmacist/dashboard}" class="nav-item" th:classappend="${currentTab == 'dashboard' ? 'active' : ''}">
                <i class="fa-solid fa-chart-line"></i>
                <span>Trang chủ</span>
            </a>
            <a th:href="@{/pharmacist/drug-list}" class="nav-item" th:classappend="${currentTab == 'drugs' ? 'active' : ''}">
                <i class="fa-solid fa-pills"></i>
                <span>Quản lý thuốc</span>
            </a>
            <a th:href="@{/pharmacist/drug-import}" class="nav-item" th:classappend="${currentTab == 'import' ? 'active' : ''}">
                <i class="fa-solid fa-file-import"></i>
                <span>Nhập kho</span>
            </a>
            <a th:href="@{/pharmacist/dispense-list}" class="nav-item" th:classappend="${currentTab == 'dispense' ? 'active' : ''}">
                <i class="fa-solid fa-receipt"></i>
                <span>Cấp phát thuốc</span>
            </a>
            <a th:href="@{/pharmacist/inventory}" class="nav-item" th:classappend="${currentTab == 'inventory' ? 'active' : ''}">
                <i class="fa-solid fa-boxes-stacked"></i>
                <span>Tồn kho</span>
            </a>
            <a th:href="@{/pharmacist/reports}" class="nav-item" th:classappend="${currentTab == 'reports' ? 'active' : ''}">
                <i class="fa-solid fa-chart-pie"></i>
                <span>Báo cáo</span>
            </a>
            <a th:href="@{/pharmacist/profile}" class="nav-item" th:classappend="${currentTab == 'profile' ? 'active' : ''}">
                <i class="fa-solid fa-user-circle"></i>
                <span>Hồ sơ cá nhân</span>
            </a>
        </nav>

        <!-- User Profile & Logout -->
        <div class="sidebar-bottom">
            <div class="sidebar-user-profile">
                <div class="sidebar-user-avatar" th:text="${userFullName != null ? userFullName.substring(0, 1).toUpperCase() : 'D'}">D</div>
                <div class="sidebar-user-info">
                    <h4 th:text="${userFullName}">Dược sĩ</h4>
                    <span>Dược sĩ</span>
                </div>
            </div>
            <a href="#" class="logout-btn" onclick="confirmLogout(event)">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Đăng xuất</span>
            </a>
        </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="wrapper">
        <!-- Topbar -->
        <header class="topbar">
            <div class="topbar-left">
                <h1 th:text="${title}">Trang chủ</h1>
            </div>
        </header>

        <!-- Flash Messages -->
        <div th:if="${success}" class="alert alert-success">
            <i class="fa-regular fa-circle-check"></i>
            <span th:text="${success}"></span>
            <button type="button" class="alert-close" onclick="closeAlert(this)">&times;</button>
        </div>
        <div th:if="${error}" class="alert alert-danger">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span th:text="${error}"></span>
            <button type="button" class="alert-close" onclick="closeAlert(this)">&times;</button>
        </div>

        <!-- Dynamic Content -->
        <div th:replace="${content}"></div>
    </div>

    <!-- Logout Modal -->
    <div id="logoutModal" class="logout-modal" style="display: none;">
        <div class="logout-modal-overlay" onclick="closeLogoutModal()"></div>
        <div class="logout-modal-content">
            <div class="logout-modal-icon">
                <i class="fa-solid fa-circle-exclamation"></i>
            </div>
            <h3>Xác nhận đăng xuất</h3>
            <p>Bạn có chắc chắn muốn đăng xuất khỏi hệ thống?</p>
            <div class="logout-modal-actions">
                <button type="button" class="btn-action btn-outline" onclick="closeLogoutModal()">
                    <i class="fa-solid fa-times"></i> Hủy
                </button>
                <form th:action="@{/auth/logout}" method="post" style="flex: 1; display: flex;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn-action btn-danger" style="width: 100%;">
                        <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        function confirmLogout(event) {
            event.preventDefault();
            document.getElementById('logoutModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeLogoutModal() {
            document.getElementById('logoutModal').style.display = 'none';
            document.body.style.overflow = '';
        }

        function closeAlert(button) {
            const alert = button.closest('.alert');
            if (alert) {
                alert.style.transition = 'opacity 0.3s ease';
                alert.style.opacity = '0';
                setTimeout(function() {
                    alert.style.display = 'none';
                }, 300);
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeLogoutModal();
            }
        });

        document.addEventListener('click', function(e) {
            var modal = document.getElementById('logoutModal');
            if (e.target === modal) {
                closeLogoutModal();
            }
        });
    </script>
</body>
</html>
