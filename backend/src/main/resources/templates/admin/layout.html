<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="main-layout(content, title, currentTab)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | Admin Panel'">Admin Panel</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <!-- Base Layout CSS -->
    <link rel="stylesheet" th:href="@{/css/admin/layout.css}">
    <script th:src="@{/js/admin/ignore-well-known.js}" defer></script>
</head>
<body>
<!-- Sidebar -->
<aside class="sidebar">
    <div class="sidebar-brand">
        <i class="fa-solid fa-hospital-user"></i>
        <h2>MEDIC ADMIN</h2>
    </div>
    <nav class="sidebar-nav">
        <a th:href="@{/admin/dashboard}" class="nav-item" th:classappend="${currentTab == 'dashboard' ? 'active' : ''}">
            <i class="fa-solid fa-chart-pie"></i>
            <span>Tổng quan</span>
        </a>
        <a th:href="@{/admin/users}" class="nav-item" th:classappend="${currentTab == 'users' ? 'active' : ''}">
            <i class="fa-solid fa-user-gear"></i>
            <span>Quản lý người dùng</span>
        </a>
        <a th:href="@{/admin/create-staff}" class="nav-item" th:classappend="${currentTab == 'create-staff' ? 'active' : ''}">
            <i class="fa-solid fa-user-plus"></i>
            <span>Tạo tài khoản nội bộ</span>
        </a>
        <a th:href="@{/admin/logs}" class="nav-item" th:classappend="${currentTab == 'logs' ? 'active' : ''}">
            <i class="fa-solid fa-list-check"></i>
            <span>Nhật ký hoạt động</span>
        </a>
        <a th:href="@{/admin/security}" class="nav-item" th:classappend="${currentTab == 'security' ? 'active' : ''}">
            <i class="fa-solid fa-shield-halved"></i>
            <span>Bảo mật IP</span>
        </a>
        <a th:href="@{/admin/profile}" class="nav-item" th:classappend="${currentTab == 'profile' ? 'active' : ''}">
            <i class="fa-solid fa-user"></i>
            <span>Hồ sơ cá nhân</span>
        </a>
    </nav>

    <!-- User Profile & Logout -->
    <div class="sidebar-bottom">
        <div class="sidebar-user-profile">
            <div class="sidebar-user-avatar">
                <span th:text="${#strings.substring(userFullName, 0, 1)}">B</span>
            </div>
            <div class="sidebar-user-info">
                <h4 th:text="${userFullName}">Quản trị viên</h4>
                <span>Quản trị viên</span>
            </div>
        </div>
        <a href="#" class="logout-btn" onclick="confirmLogout(event)">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Đăng xuất</span>
        </a>
    </div>
</aside>

<!-- Main Content Wrapper -->
<div class="wrapper">
    <!-- Topbar -->
    <header class="topbar">
        <div class="topbar-left">
            <h1 th:text="${title}">Dashboard</h1>
        </div>
        <div class="topbar-right">
            <!-- ===== GLOBAL SEARCH ===== -->
            <div class="search-wrapper">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text"
                           id="globalSearchInput"
                           name="keyword"
                           placeholder="Tìm kiếm toàn hệ thống..."
                           autocomplete="off">
                </div>
                <!-- Dropdown kết quả -->
                <div id="searchResults" class="search-dropdown" style="display: none;">
                    <!-- Kết quả sẽ được render bởi JavaScript -->
                </div>
            </div>
        </div>
    </header>

    <!-- Success -->
    <div th:if="${success != null}" class="alert alert-success">
        <i class="fa-regular fa-circle-check"></i>
        <span th:text="${success}"></span>
        <button type="button" class="alert-close" onclick="closeAlert(this)">&times;</button>
    </div>

    <!-- Error -->
    <div th:if="${error != null}" class="alert alert-danger">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span th:text="${error}"></span>
        <button type="button" class="alert-close" onclick="closeAlert(this)">&times;</button>
    </div>

    <!-- Dynamic Content Insertion -->
    <div th:replace="${content}"></div>
</div>

<!-- ===== LOGOUT CONFIRM MODAL ===== -->
<div id="logoutModal" class="logout-modal" style="display: none;">
    <div class="logout-modal-overlay" onclick="closeLogoutModal()"></div>
    <div class="logout-modal-content">
        <div class="logout-modal-icon">
            <i class="fa-solid fa-circle-exclamation"></i>
        </div>
        <h3 class="logout-modal-title">Xác nhận đăng xuất</h3>
        <p class="logout-modal-desc">Bạn có chắc chắn muốn đăng xuất khỏi hệ thống?</p>
        <div class="logout-modal-actions">
            <button type="button" class="btn-action btn-outline" onclick="closeLogoutModal()">
                <i class="fa-solid fa-times"></i> Hủy
            </button>
            <form th:action="@{/auth/logout}" method="post" style="flex: 1; display: flex;">
                <!-- Thêm CSRF token -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn-action btn-danger" style="width: 100%;">
                    <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
                </button>
            </form>
        </div>
    </div>
</div>

<!-- Global Search JavaScript -->
<script th:src="@{/js/admin/global-search.js}"></script>
<script>
    function confirmLogout(event) {
        event.preventDefault();
        document.getElementById('logoutModal').style.display = 'flex';
        document.body.style.overflowY = 'hidden';
    }

    function closeLogoutModal() {
        document.getElementById('logoutModal').style.display = 'none';
        document.body.style.overflowY = '';
    }

    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            closeLogoutModal();
        }
    });

    document.addEventListener('click', function(e) {
        var modal = document.getElementById('logoutModal');
        if (e.target === modal) {
            closeLogoutModal();
        }
    });

    document.querySelector('.logout-modal-overlay')?.addEventListener('click', function() {
        closeLogoutModal();
    });
</script>
</body>
</html>
