<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gửi lại OTP</title>
    <link rel="stylesheet" th:href="@{/css/auth/auth.css}" />
</head>
<body>
<div class="login-page">
    <div class="login-left">
        <div class="login-left-content">
            <div class="login-logo">+</div>
            <h1 class="login-app-name">Cervical Dx</h1>
            <p class="login-tagline">Hệ thống sàng lọc ung thư cổ tử cung hỗ trợ bởi trí tuệ nhân tạo</p>
            <div class="decor-circle c1"></div>
            <div class="decor-circle c2"></div>
            <div class="decor-circle c3"></div>
        </div>
    </div>
    <div class="login-right">
        <div class="login-card card">
            <div class="login-card-header">
                <h2>Gửi lại mã OTP</h2>
                <p>Nhấn nút dưới đây để nhận lại mã kích hoạt vào Email của bạn.</p>
            </div>

            <div th:if="${successMessage}" class="alert alert-success">
                <span>✓</span>
                <span th:text="${successMessage}"></span>
            </div>
            <div th:if="${error}" class="alert alert-error">
                <span>!</span>
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/auth/register/resend-otp}" th:object="${resendRequest}" method="post">
                <!-- Ẩn username -->
                <input type="hidden" id="userName" th:field="*{userName}" />
                <p th:if="${#fields.hasErrors('userName')}" class="field-error" th:errors="*{userName}" style="text-align: center; margin-bottom: 10px;"></p>
                <button type="submit" class="btn btn-primary">Gửi lại OTP</button>
            </form>
            <div class="login-action-row">
                <a class="login-forgot-link" th:href="@{/auth/register/verify-otp(userName=${resendRequest.userName})}">Quay lại xác thực OTP</a>
                <a class="login-forgot-link" th:href="@{/auth/login}">Quay về đăng nhập</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
