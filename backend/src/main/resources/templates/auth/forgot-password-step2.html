<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác minh OTP</title>
    <link rel="stylesheet" th:href="@{/css/auth/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth/login.css}">
    <link rel="stylesheet" th:href="@{/css/auth/forgot-password.css}">
</head>
<body>

<div class="login-page">
    <div class="login-left">
        <div class="login-left-content">
            <div class="login-logo"><span>+</span></div>
            <h1 class="login-app-name">MedAI</h1>
            <p class="login-tagline">Hệ thống sàng lọc ung thư cổ tử cung hỗ trợ bởi trí tuệ nhân tạo</p>
        </div>
    </div>

    <div class="login-right">
        <div class="login-card card">
            <div class="login-card-header">
                <h2>Xác minh OTP</h2>
                <p class="text-muted">
                    Mã gồm 6 chữ số đã được gửi tới <strong th:text="${email}"></strong>.
                </p>
            </div>

            <div th:if="${resent}" class="alert alert-success mb-16">
                <span>✓</span> Đã gửi lại mã OTP mới.
            </div>
            <div th:if="${error}" class="alert alert-error mb-16">
                <span>❌</span> <span th:text="${error}"></span>
            </div>

            <form th:action="@{/forgot-password/verify-otp}" method="post">
                <div class="form-group">
                    <label class="form-label" for="otp">Mã OTP <span class="required">*</span></label>
                    <input id="otp" name="otp" type="text" inputmode="numeric" maxlength="6"
                           pattern="\d*" class="form-input" autofocus required>
                </div>

                <div id="otp-timer" class="otp-timer">
                    ⏱ Mã hết hạn sau <strong id="otp-countdown">02:00</strong>
                </div>

                <button class="btn btn-primary btn-full mt-24" type="submit">Xác minh mã</button>
            </form>

            <form th:action="@{/forgot-password/resend-otp}" method="post" style="margin-top:12px;text-align:center">
                <button type="submit" id="resend-btn" class="otp-resend-btn" disabled>Gửi lại OTP</button>
            </form>

            <div class="login-forgot-row" style="justify-content:center;margin-top:18px">
                <a th:href="@{/login}" class="login-forgot-link">← Quay lại trang đăng nhập</a>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/auth/forgot-password.js}"></script>
</body>
</html>
