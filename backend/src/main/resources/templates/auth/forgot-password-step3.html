<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt mật khẩu mới</title>
    <link rel="stylesheet" th:href="@{/css/auth/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth/login.css}">
    <link rel="stylesheet" th:href="@{/css/auth/forgot-password.css}">
</head>
<body>

<div class="login-page">
    <div class="login-left">
        <div class="login-left-content">
            <div class="login-logo"><span>+</span></div>
            <h1 class="login-app-name">Cervical Dx</h1>
            <p class="login-tagline">Hệ thống sàng lọc ung thư cổ tử cung hỗ trợ bởi trí tuệ nhân tạo</p>
        </div>
    </div>

    <div class="login-right">
        <div class="login-card card">
            <div class="login-card-header">
                <h2>Đặt mật khẩu mới</h2>
                <p class="text-muted">Mật khẩu phải có ít nhất 8 ký tự, gồm chữ hoa, chữ thường, số và ký tự đặc biệt.</p>
            </div>

            <div th:if="${error}" class="alert alert-error mb-16">
                <span>❌</span> <span th:text="${error}"></span>
            </div>

            <form th:action="@{/forgot-password/reset}" th:object="${form}" method="post">
                <div class="form-group">
                    <label class="form-label" for="new-pwd">Mật khẩu mới <span class="required">*</span></label>
                    <div class="password-input-wrap">
                        <input id="new-pwd" type="password" class="form-input" th:field="*{newPassword}" autofocus required>
                    </div>
                </div>
                <div class="form-group mt-16">
                    <label class="form-label" for="confirm-pwd">Xác nhận mật khẩu <span class="required">*</span></label>
                    <div class="password-input-wrap">
                        <input id="confirm-pwd" type="password" class="form-input" th:field="*{confirmPassword}" required>
                    </div>
                </div>
                <button class="btn btn-primary btn-full mt-24" type="submit">Đặt lại mật khẩu</button>
            </form>

            <div class="login-forgot-row" style="justify-content:center;margin-top:18px">
                <a th:href="@{/auth/login}" class="login-forgot-link">← Quay lại trang đăng nhập</a>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/auth/password-toggle.js}"></script>
</body>
</html>
