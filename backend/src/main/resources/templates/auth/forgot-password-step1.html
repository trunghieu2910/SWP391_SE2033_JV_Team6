<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu</title>
    <link rel="stylesheet" th:href="@{/css/auth/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth/login.css}">
    <link rel="stylesheet" th:href="@{/css/auth/forgot-password.css}">
</head>
<body>

<div class="login-page">
    <div class="login-left">
        <div class="login-left-content">
            <div class="login-logo"><span>+</span></div>
            <h1 class="login-app-name">MedAI</h1>
            <p class="login-tagline">Hệ thống sàng lọc ung thư cổ tử cung hỗ trợ bởi trí tuệ nhân tạo</p>
        </div>
    </div>

    <div class="login-right">
        <div class="login-card card">
            <div class="login-card-header">
                <h2>Quên mật khẩu</h2>
                <p class="text-muted">Nhập email đã đăng ký để nhận mã OTP đặt lại mật khẩu.</p>
            </div>

            <div th:if="${error}" class="alert alert-error mb-16">
                <span>❌</span> <span th:text="${error}"></span>
            </div>

            <form th:action="@{/forgot-password}" th:object="${form}" method="post">
                <div class="form-group">
                    <label class="form-label" for="fp-email">Email <span class="required">*</span></label>
                    <input id="fp-email" type="email" class="form-input"
                           th:field="*{email}" placeholder="doctor@hospital.com" autofocus required>
                </div>
                <button class="btn btn-primary btn-full mt-24" type="submit">Gửi OTP</button>
                <div class="login-forgot-row" style="justify-content:center;margin-top:18px">
                    <a th:href="@{/auth/login}" class="login-forgot-link">← Quay lại trang đăng nhập</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
