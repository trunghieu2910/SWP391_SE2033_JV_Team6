<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="main-layout(content, title, currentTab)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | Ultrasound Doctor Panel'">Ultrasound Doctor Panel</title>
    <meta th:name="${_csrf.parameterName}" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <!-- Reuse Doctor Layout CSS as it's just a generic dashboard layout -->
    <link rel="stylesheet" th:href="@{/css/doctor/layout.css}">
</head>
<body>
<!-- Sidebar -->
<aside class="sidebar" aria-label="Main Navigation">
    <div class="sidebar-brand">
        <i class="fa-solid fa-notes-medical"></i>
        <h2>Cervical Dx</h2>
    </div>
    <nav class="sidebar-nav">
        <a th:href="@{/ultrasound-doctor/dashboard}" class="nav-item" th:classappend="${currentTab == 'dashboard' ? 'active' : ''}">
            <i class="fa-solid fa-list"></i>
            <span>Danh sách siêu âm</span>
        </a>
        <a th:href="@{/ultrasound-doctor/history}" class="nav-item" th:classappend="${currentTab == 'history' ? 'active' : ''}">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>Lịch sử siêu âm</span>
        </a>
    </nav>

    <!-- User Profile & Logout -->
    <div class="sidebar-bottom">
        <a th:href="@{/ultrasound-doctor/profile}" class="sidebar-user-profile" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 8px; transition: background-color 0.2s; cursor: pointer;">
            <div class="sidebar-user-avatar">
                <span th:text="${#strings.substring(userFullName != null ? userFullName : 'T', 0, 1)}">T</span>
            </div>
            <div class="sidebar-user-info">
                <h4 th:text="${userFullName != null ? userFullName : 'Bác sĩ siêu âm'}">Bác sĩ siêu âm</h4>
                <span>Bác sĩ siêu âm</span>
            </div>
        </a>
        <a href="#" class="logout-btn" onclick="confirmLogout(event)">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Đăng xuất</span>
        </a>
    </div>
</aside>

<!-- Main Content Wrapper -->
<div class="wrapper">
    <!-- Topbar -->
    <header class="topbar">
        <div class="topbar-left">
            <h1 th:text="${title}">Danh sách siêu âm</h1>
        </div>
        <div class="topbar-right">
        </div>
    </header>

    <!-- Flash Messages -->
    <div th:if="${success}" class="alert alert-success" role="alert">
        <i class="fa-regular fa-circle-check"></i>
        <span th:text="${success}"></span>
        <button type="button" class="alert-close" onclick="closeAlert(this)" aria-label="Close">&times;</button>
    </div>
    <div th:if="${error}" class="alert alert-danger" role="alert">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span th:text="${error}"></span>
        <button type="button" class="alert-close" onclick="closeAlert(this)" aria-label="Close">&times;</button>
    </div>

    <!-- Dynamic Content -->
    <div th:replace="${content}"></div>
</div>

<!-- Logout Modal -->
<div id="logoutModal" class="logout-modal" style="display: none;" role="dialog" aria-labelledby="logoutTitle" aria-modal="true">
    <div class="logout-modal-overlay" onclick="closeLogoutModal()"></div>
    <div class="logout-modal-content">
        <div class="logout-modal-icon">
            <i class="fa-solid fa-circle-exclamation"></i>
        </div>
        <h3 id="logoutTitle">Xác nhận đăng xuất</h3>
        <p>Bạn có chắc chắn muốn đăng xuất khỏi hệ thống?</p>
        <div class="logout-modal-actions">
            <button type="button" class="btn-action btn-outline" onclick="closeLogoutModal()">
                <i class="fa-solid fa-times"></i> Hủy
            </button>
            <form th:action="@{/auth/logout}" method="post" style="flex: 1; display: flex;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn-action btn-danger" style="width: 100%;">
                    <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
                </button>
            </form>
        </div>
    </div>
</div>

<!-- Scripts -->
<script>
    function confirmLogout(event) {
        event.preventDefault();
        document.getElementById('logoutModal').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeLogoutModal() {
        document.getElementById('logoutModal').style.display = 'none';
        document.body.style.overflow = '';
    }

    function closeAlert(button) {
        const alert = button.closest('.alert');
        if (alert) {
            alert.style.transition = 'opacity 0.3s ease';
            alert.style.opacity = '0';
            setTimeout(function() {
                alert.style.display = 'none';
            }, 300);
        }
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeLogoutModal();
        }
    });

    document.addEventListener('click', function(e) {
        var modal = document.getElementById('logoutModal');
        if (e.target === modal) {
            closeLogoutModal();
        }
    });
</script>
</body>
</html>
