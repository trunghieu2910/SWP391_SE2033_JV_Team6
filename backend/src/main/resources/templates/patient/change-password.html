<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{patient/layout :: main-layout(~{::main}, 'Đổi mật khẩu')}">
<body>
<main>
    <div style="max-width: 600px; margin: 40px auto; background: white; padding: 32px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
        <h2 style="font-size: 24px; font-weight: 700; color: #1e293b; margin-bottom: 24px; text-align: center;">Đổi mật khẩu</h2>
        
        <div th:if="${error}" style="background-color: #fee2e2; color: #b91c1c; padding: 12px; border-radius: 6px; margin-bottom: 24px; text-align: center;" th:text="${error}">
            Lỗi
        </div>
        
        <div th:if="${successMessage}" style="background-color: #dcfce7; color: #15803d; padding: 12px; border-radius: 6px; margin-bottom: 24px; text-align: center;" th:text="${successMessage}">
            Thành công
        </div>
        
        <form th:action="@{/patient/change-password}" th:object="${passwordForm}" method="post">
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 600; font-size: 14px; color: #334155; margin-bottom: 8px;" for="oldPassword">Mật khẩu cũ <span style="color: #ef4444;">*</span></label>
                <div style="position: relative;">
                    <input style="width: 100%; padding: 12px; padding-right: 40px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;" id="oldPassword" type="password" th:field="*{oldPassword}" placeholder="Nhập mật khẩu hiện tại" required />
                    <button type="button" onclick="togglePassword('oldPassword', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #64748b;"><i class="fa-solid fa-eye"></i></button>
                </div>
                <div style="color: #ef4444; font-size: 12px; margin-top: 4px;" th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}"></div>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 600; font-size: 14px; color: #334155; margin-bottom: 8px;" for="newPassword">Mật khẩu mới <span style="color: #ef4444;">*</span></label>
                <div style="position: relative;">
                    <input style="width: 100%; padding: 12px; padding-right: 40px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;" id="newPassword" type="password" th:field="*{newPassword}" placeholder="Nhập mật khẩu mới" required />
                    <button type="button" onclick="togglePassword('newPassword', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #64748b;"><i class="fa-solid fa-eye"></i></button>
                </div>
                <div style="color: #ef4444; font-size: 12px; margin-top: 4px;" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
            </div>

            <div style="margin-bottom: 32px;">
                <label style="display: block; font-weight: 600; font-size: 14px; color: #334155; margin-bottom: 8px;" for="confirmPassword">Xác nhận mật khẩu mới <span style="color: #ef4444;">*</span></label>
                <div style="position: relative;">
                    <input style="width: 100%; padding: 12px; padding-right: 40px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box;" id="confirmPassword" type="password" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu mới" required />
                    <button type="button" onclick="togglePassword('confirmPassword', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #64748b;"><i class="fa-solid fa-eye"></i></button>
                </div>
                <div style="color: #ef4444; font-size: 12px; margin-top: 4px;" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>

            <div style="display: flex; gap: 16px;">
                <a th:href="@{/patient/profile}" style="flex: 1; padding: 12px; text-align: center; font-weight: 600; border-radius: 6px; border: 1px solid #cbd5e1; background: white; color: #334155; text-decoration: none;">Quay lại Hồ sơ</a>
                <button type="submit" style="flex: 1; padding: 12px; font-weight: 600; border-radius: 6px; border: none; background: #0284c7; color: white; cursor: pointer;">Cập nhật mật khẩu</button>
            </div>
        </form>
        
        <script>
            function togglePassword(inputId, btn) {
                const input = document.getElementById(inputId);
                const icon = btn.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            }
        </script>
    </div>
</main>
</body>
</html>
