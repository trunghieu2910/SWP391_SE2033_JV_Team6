<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{patient/layout :: main-layout(~{::main}, 'Tạo nhắc uống thuốc', 'reminders')}">
<body>
<main>
    <link rel="stylesheet" th:href="@{/css/patient/reminder-new.css}"/>

    <div class="page-shell">
        <div class="page-header">
            <div>
                <p class="eyebrow"><i class="fa-solid fa-bell"></i> Nhắc uống thuốc</p>
                <h1 th:text="${editingReminderId != null} ? 'Chỉnh sửa nhắc uống thuốc' : 'Tạo nhắc uống thuốc mới'">Tạo nhắc uống thuốc mới</h1>
                <p class="subtext" th:text="${editingReminderId != null} ? 'Sửa lại nhắc hiện tại và lưu để tiếp tục nhận nhắc.' : 'Ghi chú này sẽ được gửi email cho bạn khi đến thời gian đã lên lịch.'">Ghi chú này sẽ được gửi email cho bạn khi đến thời gian đã lên lịch.</p>
            </div>
        </div>

        <div class="content-grid">
            <!-- Cột trái: Form tạo nhắc nhở -->
            <div class="form-card">
                <form th:action="${editingReminderId != null} ? @{/patient/reminders/{id}/edit(id=${editingReminderId})} : @{/patient/reminders/new}" th:object="${reminderRequest}" method="post">
                    <div class="form-group full-width">
                        <label for="note">
                            <i class="fa-solid fa-prescription-bottle-medical"></i> Ghi chú nhắc
                        </label>
                        <textarea id="note" class="form-input form-textarea" th:field="*{note}" placeholder="Ví dụ: Uống thuốc 2 viên sau bữa sáng" rows="5"></textarea>
                        <p class="error" th:if="${#fields.hasErrors('note')}" th:errors="*{note}"></p>
                    </div>

                    <div class="form-group full-width">
                        <label>
                            <i class="fa-regular fa-clock"></i> Khung giờ nhắc trong ngày <span class="required" style="color:#ef4444;">*</span>
                        </label>
                        <div id="timeSlotsContainer" style="display: flex; flex-direction: column; gap: 10px;">
                            <div class="time-slot-item" style="display: flex; align-items: center; gap: 8px;">
                                <input type="time" class="form-input" name="scheduledTimes" th:value="${reminderRequest.scheduledTime}" required style="flex: 1;"/>
                                <button type="button" class="btn-remove-time" onclick="removeTimeSlot(this)" style="display: none; background: #fee2e2; color: #ef4444; border: none; border-radius: 6px; width: 38px; height: 38px; cursor: pointer; align-items: center; justify-content: center;" title="Xóa giờ này">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <button type="button" id="addTimeBtn" onclick="addTimeSlot()" style="margin-top: 10px; background: #f0f9ff; color: #0284c7; border: 1.5px dashed #0284c7; border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
                            <i class="fa-solid fa-plus-circle"></i>
                            <span>Thêm giờ nhắc (nếu uống 2, 3 lần/ngày)</span>
                        </button>
                        <p class="error" th:if="${#fields.hasErrors('scheduledTime')}" th:errors="*{scheduledTime}"></p>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">
                            <i class="fa-solid fa-circle-check"></i>
                            <span th:text="${editingReminderId != null} ? 'Cập nhật nhắc' : 'Lưu nhắc'">Lưu nhắc</span>
                        </button>
                        <a th:if="${editingReminderId != null}" th:href="@{/patient/reminders/new}" class="btn-secondary">
                            <i class="fa-solid fa-ban"></i> Hủy
                        </a>
                    </div>
                </form>

                <script>
                function addTimeSlot() {
                    const container = document.getElementById('timeSlotsContainer');
                    if (!container) return;
                    const items = container.querySelectorAll('.time-slot-item');
                    const newItem = items[0].cloneNode(true);
                    const input = newItem.querySelector('input');
                    if (input) input.value = '';
                    container.appendChild(newItem);
                    updateRemoveButtons();
                }

                function removeTimeSlot(btn) {
                    const container = document.getElementById('timeSlotsContainer');
                    if (!container) return;
                    const items = container.querySelectorAll('.time-slot-item');
                    if (items.length > 1) {
                        btn.closest('.time-slot-item').remove();
                        updateRemoveButtons();
                    }
                }

                function updateRemoveButtons() {
                    const container = document.getElementById('timeSlotsContainer');
                    if (!container) return;
                    const items = container.querySelectorAll('.time-slot-item');
                    items.forEach((item, idx) => {
                        const btn = item.querySelector('.btn-remove-time');
                        if (btn) {
                            btn.style.display = (items.length > 1) ? 'inline-flex' : 'none';
                        }
                    });
                }
                </script>

                <div th:if="${successMessage}" class="success-box">
                    <span th:text="${successMessage}"></span>
                </div>
            </div>

            <!-- Cột phải: Danh sách nhắc nhở -->
            <div class="summary-card">
                <h2><i class="fa-solid fa-calendar-day"></i> Nhắc hàng ngày</h2>
                <p class="muted">Nhắc sẽ được gửi mỗi ngày vào giờ đã chọn cho đến khi bạn xóa.</p>

                <div th:if="${reminders != null and !reminders.isEmpty()}" class="reminder-list-container">
                    <div th:each="reminder : ${reminders}" class="reminder-card">
                        <div class="reminder-card-left">
                            <div class="reminder-icon-wrapper">
                                <i class="fa-solid fa-pills"></i>
                            </div>
                            <div class="reminder-details">
                                <span class="reminder-time">
                                    <i class="fa-regular fa-clock" style="font-size: 13.5px; color: #64748b; margin-top: 1px;"></i>
                                    <span th:text="${reminder.scheduledTime != null ? reminder.scheduledTime.format(T(java.time.format.DateTimeFormatter).ofPattern('HH:mm')) : ''}"></span>
                                </span>
                                <span class="reminder-note" th:text="${reminder.note}"></span>
                                <div class="reminder-meta">
                                    <span class="reminder-created">
                                        <i class="fa-regular fa-calendar-check"></i>
                                        <span th:text="${reminder.createdAt != null ? reminder.createdAt.format(T(java.time.format.DateTimeFormatter).ofPattern('dd/MM/yyyy')) : ''}"></span>
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="reminder-actions">
                            <a th:href="@{/patient/reminders/{id}/edit(id=${reminder.reminderId})}" class="btn-edit-icon" title="Sửa nhắc">
                                <i class="fa-regular fa-pen-to-square"></i>
                            </a>
                            <form th:action="@{/patient/reminders/{id}/delete(id=${reminder.reminderId})}" method="post" class="reminder-action-form" onsubmit="return confirm('Bạn có chắc chắn muốn xóa lời nhắc uống thuốc này không?');">
                                <button type="submit" class="btn-delete-icon" title="Xóa nhắc nhở">
                                    <i class="fa-regular fa-trash-can"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
                
                <div th:if="${reminders == null or reminders.isEmpty()}" class="empty-state-card">
                    <i class="fa-solid fa-bell-slash"></i>
                    <p class="empty-state-title">Chưa có nhắc uống thuốc</p>
                    <p class="empty-state-desc">Danh sách nhắc nhở hàng ngày của bạn sẽ xuất hiện tại đây.</p>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
