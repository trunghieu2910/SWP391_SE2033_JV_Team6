<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu - Cervical Dx</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
        }
        main {
            padding: 20px;
        }
    </style>
</head>
<body>
<main>
    <div style="max-width: 600px; margin: 40px auto; background: white; padding: 32px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
        <h2 style="font-size: 24px; font-weight: 700; color: #1e293b; margin-bottom: 24px; text-align: center;">Đổi mật khẩu</h2>
        
        <div th:if="${error}" style="background-color: #fee2e2; color: #b91c1c; padding: 12px; border-radius: 6px; margin-bottom: 24px; text-align: center;" th:text="${error}">
            Lỗi
        </div>

        <div th:if="${successMessage}" style="background-color: #dcfce7; color: #15803d; padding: 12px; border-radius: 6px; margin-bottom: 24px; text-align: center;" th:text="${successMessage}">
            Thành công
        </div>
        
        <form th:action="@{/change-password}" th:object="${passwordForm}" method="post">
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 600; font-size: 14px; color: #334155; margin-bottom: 8px;" for="oldPassword">Mật khẩu cũ <span style="color: #ef4444;">*</span></label>
                <div style="position: relative;">
                    <input style="width: 100%; box-sizing: border-box; padding: 10px 40px 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;" 
                           type="password" id="oldPassword" th:field="*{oldPassword}" placeholder="Nhập mật khẩu cũ">
                    <button type="button" onclick="togglePassword('oldPassword', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #64748b;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
                <div style="color: #ef4444; font-size: 12px; margin-top: 4px;" th:if="${#fields.hasErrors('oldPassword')}" th:errors="*{oldPassword}"></div>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-weight: 600; font-size: 14px; color: #334155; margin-bottom: 8px;" for="newPassword">Mật khẩu mới <span style="color: #ef4444;">*</span></label>
                <div style="position: relative;">
                    <input style="width: 100%; box-sizing: border-box; padding: 10px 40px 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;" 
                           type="password" id="newPassword" th:field="*{newPassword}" placeholder="Nhập mật khẩu mới">
                    <button type="button" onclick="togglePassword('newPassword', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #64748b;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
                <div style="color: #ef4444; font-size: 12px; margin-top: 4px;" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
            </div>

            <div style="margin-bottom: 24px;">
                <label style="display: block; font-weight: 600; font-size: 14px; color: #334155; margin-bottom: 8px;" for="confirmPassword">Xác nhận mật khẩu <span style="color: #ef4444;">*</span></label>
                <div style="position: relative;">
                    <input style="width: 100%; box-sizing: border-box; padding: 10px 40px 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;" 
                           type="password" id="confirmPassword" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu mới">
                    <button type="button" onclick="togglePassword('confirmPassword', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #64748b;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
                <div style="color: #ef4444; font-size: 12px; margin-top: 4px;" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>

            <div style="display: flex; gap: 12px; justify-content: flex-end;">
                <a th:href="@{${backUrl}}" style="padding: 10px 20px; font-weight: 600; border-radius: 6px; border: 1px solid #cbd5e1; background: white; color: #334155; text-decoration: none;">Quay lại</a>
                <button type="submit" style="padding: 10px 20px; font-weight: 600; border-radius: 6px; border: none; background: #0284c7; color: white; cursor: pointer; transition: all 0.2s;">Xác nhận</button>
            </div>
        </form>
    </div>

    <script>
        function togglePassword(inputId, btn) {
            var input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
            } else {
                input.type = "password";
                btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
            }
        }
    </script>
</main>
</body>
</html>
