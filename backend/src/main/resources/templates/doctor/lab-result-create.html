<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{doctor/layout}">
<head><title>Tạo chỉ định xét nghiệm</title></head>
<body>
<div layout:fragment="content">

    <div class="page-header">
        <div>
            <h1 class="page-title">Tạo chỉ định xét nghiệm</h1>
            <p class="page-subtitle" th:if="${session != null}">
                Phiên khám #<span th:text="${session.sessionId}"></span> —
                <span th:text="${session.patient.user.fullName}"></span>
            </p>
        </div>
    </div>

    <!-- Thông báo lỗi validation (nếu có) -->
    <div class="alert alert-error mb-4"
         th:if="${#fields.hasErrors('labResultForm.*')}">
        <span>⚠️</span>
        <ul style="margin:0; padding-left:18px;">
            <li th:each="err : ${#fields.errors('labResultForm.*')}" th:text="${err}"></li>
        </ul>
    </div>

    <form th:action="@{/doctor/lab-results/create}" th:object="${labResultForm}" method="post">

        <!-- CSRF token: thymeleaf-extras-springsecurity6 TỰ ĐỘNG chèn khi dùng th:action -->
        <!-- Không cần khai báo thủ công <input type="hidden" name="_csrf">, đã có sẵn -->

        <input type="hidden" th:field="*{sessionId}">

        <div class="card">
            <div class="form-group">
                <label class="form-label">Loại xét nghiệm</label>
                <select th:field="*{testType}" class="form-input form-select">
                    <option value="">-- Chọn loại xét nghiệm --</option>
                    <option value="Xét nghiệm tế bào học cổ tử cung">Xét nghiệm tế bào học cổ tử cung</option>
                    <option value="Xét nghiệm DNA của virus HPV">Xét nghiệm DNA của virus HPV</option>
                    <option value="Định tuýp HPV nguy cơ cao">Định tuýp HPV nguy cơ cao</option>
                    <option value="Sinh thiết">Sinh thiết</option>
                    <option value="Dấu ấn ung thư SCC">Dấu ấn ung thư SCC</option>
                    <option value="Xét nghiệm máu cơ bản">Xét nghiệm máu cơ bản</option>
                </select>
                <span class="form-error" th:if="${#fields.hasErrors('testType')}"
                      th:errors="*{testType}"></span>
            </div>
        </div>

        <div style="display:flex; gap:12px; margin-top:20px;">
            <a th:href="@{/doctor/sessions/{id}(id=${session.sessionId})}"
               class="btn btn-secondary">Hủy</a>
            <button type="submit" class="btn btn-primary">
                ✅ Tạo chỉ định xét nghiệm
            </button>
        </div>
    </form>
</div>
</body>
</html>
