<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
</head>
<body>
<!-- ========================================== -->
<!-- FRAGMENT: DANH SÁCH HÌNH ẢNH Y TẾ         -->
<!-- ========================================== -->
<div th:fragment="list(medicalImages, sessionId)">
  <div class="image-container">
    <div th:if="${not #lists.isEmpty(medicalImages)}">
      <div class="image-grid">
        <div th:each="img : ${medicalImages}" class="image-item">
          <div class="image-header" style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <span th:text="${img.imageType}" style="font-weight: 600;">MRI</span>
              <span th:text="${img.status.name() == 'PENDING' ? 'Chờ xử lý' :
                                           img.status.name() == 'COMPLETED' ? 'Hoàn thành' :
                                           img.status.name() == 'CANCELED' ? 'Đã hủy' : img.status}"
                    th:style="${img.status.name() == 'PENDING' ? 'color: #f59e0b; font-size: 0.85em;' : 'color: #10b981; font-size: 0.85em;'}">COMPLETED</span>
            </div>
            
            <form th:if="${img.status.name() == 'PENDING'}" 
                  th:action="@{/doctor/sessions/{sessionId}/medical-images/{imageId}/delete(sessionId=${sessionId}, imageId=${img.medicalImageId})}" 
                  method="post" style="margin: 0;"
                  onsubmit="return confirm('Bạn có chắc chắn muốn xóa chỉ định hình ảnh này?');">
                <button type="submit" class="btn btn-sm btn-outline-danger" style="padding: 2px 8px; font-size: 12px; border-radius: 4px; background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5;" title="Xóa chỉ định">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </form>
          </div>
          <div class="image-thumbs">
            <div th:each="d : ${img.images}" class="thumb">
              <img th:src="${d.imageUrl}" alt="Medical Image">
            </div>
          </div>
          <div class="image-time" th:text="${#temporals.format(img.createdAt, 'dd/MM/yyyy HH:mm')}">30/06/2026</div>
        </div>
      </div>
    </div>
    <div th:if="${#lists.isEmpty(medicalImages)}">
      <p class="empty-text">Chưa có hình ảnh y tế</p>
    </div>
    <button class="btn-action btn-outline btn-add" onclick="alert('Tính năng đang phát triển')">
      <i class="fa-solid fa-plus"></i> Thêm hình ảnh y tế
    </button>
  </div>
</div>
</body>
</html>
