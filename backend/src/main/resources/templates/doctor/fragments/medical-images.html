<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
</head>
<body>
<!-- ========================================== -->
<!-- FRAGMENT: DANH SÁCH HÌNH ẢNH Y TẾ         -->
<!-- ========================================== -->
<div th:fragment="list(medicalImages, sessionId)">
  <div class="image-container">
    <div th:if="${not #lists.isEmpty(medicalImages)}">
      <div class="image-grid">
        <div th:each="img : ${medicalImages}" class="image-item">
          <div class="image-header" style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <span th:text="${img.imageType}" style="font-weight: 600;">MRI</span>
              <span th:text="${img.status.name() == 'PENDING' ? 'Chờ xử lý' :
                                           img.status.name() == 'COMPLETED' ? 'Hoàn thành' :
                                           img.status.name() == 'CANCELED' ? 'Đã hủy' : img.status}"
                    th:style="${img.status.name() == 'PENDING' ? 'color: #f59e0b; font-size: 0.85em;' : 'color: #10b981; font-size: 0.85em;'}">COMPLETED</span>
            </div>
            
            <form th:if="${img.status.name() == 'PENDING'}" 
                  th:action="@{/doctor/sessions/{sessionId}/medical-images/{imageId}/delete(sessionId=${sessionId}, imageId=${img.medicalImageId})}" 
                  method="post" style="margin: 0;"
                  onsubmit="return confirm('Bạn có chắc chắn muốn xóa chỉ định hình ảnh này?');">
                <button type="submit" class="btn btn-sm btn-outline-danger" style="padding: 2px 8px; font-size: 12px; border-radius: 4px; background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5;" title="Xóa chỉ định">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </form>
          </div>
          <div class="image-thumbs">
            <th:block th:each="d : ${img.images}">
              <div class="thumb" th:if="${!#strings.isEmpty(d.imageUrl)}">
                <a th:href="${d.imageUrl}" target="_blank" style="display: block; text-decoration: none;">
                  <img th:src="${d.imageUrl}" alt="Ảnh gốc" title="Ảnh gốc">
                </a>
              </div>
              <div class="thumb" th:if="${!#strings.isEmpty(d.aiImageUrl)}">
                <a th:href="${d.aiImageUrl}" target="_blank" style="display: block; text-decoration: none;">
                  <img th:src="${d.aiImageUrl}" alt="Ảnh AI" title="Ảnh AI">
                </a>
              </div>
              <div class="thumb" th:if="${!#strings.isEmpty(d.imgResultConclusion)}">
                <a th:href="${d.imgResultConclusion}" target="_blank" style="display: block; text-decoration: none;">
                  <img th:src="${d.imgResultConclusion}" alt="Ảnh KTV khoanh" title="Ảnh KTV khoanh">
                </a>
              </div>
            </th:block>
          </div>
          <div class="image-time" th:text="${#temporals.format(img.createdAt, 'dd/MM/yyyy HH:mm')}">30/06/2026</div>
        </div>
      </div>
    </div>
    <div th:if="${#lists.isEmpty(medicalImages)}">
      <p class="empty-text">Chưa có hình ảnh y tế</p>
    </div>
    <button type="button" class="btn-action btn-outline btn-add" data-bs-toggle="modal" th:data-bs-target="'#addMedicalImageModal-' + ${sessionId}">
      <i class="fa-solid fa-plus"></i> Thêm hình ảnh y tế
    </button>

    <!-- Modal Thêm Hình Ảnh Y Tế -->
    <div class="modal fade" th:id="'addMedicalImageModal-' + ${sessionId}" tabindex="-1" aria-labelledby="addMedicalImageModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 12px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
          <div class="modal-header" style="background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); border-bottom: 1px solid #e2e8f0; border-radius: 12px 12px 0 0; padding: 1rem 1.5rem;">
            <h5 class="modal-title" id="addMedicalImageModalLabel" style="font-weight: 600; color: #1e293b; font-size: 1.1rem;">
                <i class="fa-solid fa-file-medical me-2" style="color: #3b82f6;"></i>Chỉ định hình ảnh y tế
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" style="font-size: 0.8rem;"></button>
          </div>
          <form th:action="@{/doctor/sessions/{sessionId}/medical-images(sessionId=${sessionId})}" method="post">
            <div class="modal-body" style="padding: 1.5rem;">
              <div class="mb-3 text-start">
                <label for="imageType" class="form-label" style="font-weight: 500; color: #475569; font-size: 0.95rem;">Thông tin/Yêu cầu (VD: Siêu âm ổ bụng, MRI não...)</label>
                <input type="text" class="form-control" id="imageType" name="imageType" required 
                       placeholder="Nhập loại hình ảnh y tế..." 
                       style="border-radius: 8px; border: 1px solid #cbd5e1; padding: 0.6rem 1rem; box-shadow: inset 0 1px 2px rgba(0,0,0,0.05); transition: all 0.2s;">
              </div>
            </div>
            <div class="modal-footer" style="border-top: 1px solid #e2e8f0; padding: 1rem 1.5rem;">
              <button type="button" class="btn btn-light" data-bs-dismiss="modal" style="border-radius: 8px; font-weight: 500; padding: 0.5rem 1.25rem;">Hủy</button>
              <button type="submit" class="btn btn-primary" style="border-radius: 8px; font-weight: 500; padding: 0.5rem 1.25rem; background-color: #3b82f6; border: none; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);">
                  <i class="fa-solid fa-check me-1"></i> Xác nhận
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
