<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="form(sessionDetail, activeDrugs, prescription)" class="prescription-fragment">

    <form id="prescriptionForm"
          th:action="@{/doctor/sessions/{id}/prescription(id=${sessionDetail.sessionId})}"
          method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="prescription-container" style="display: flex; flex-direction: column; gap: 20px;">

            <!-- Thông báo trạng thái nếu ca đã có đơn thuốc -->
            <div th:if="${prescription != null}" class="prescription-status-info" style="display: flex; align-items: center; justify-content: space-between; background-color: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 12px 16px; color: #166534;">
                <div>
                    <i class="fa-solid fa-circle-check" style="margin-right: 8px; color: #16a34a;"></i>
                    <strong>Mã đơn thuốc:</strong> <span th:text="${prescription.prescriptionCode}">RX12345</span>
                    <span style="margin: 0 8px; opacity: 0.5;">|</span>
                    <strong>Ngày kê:</strong> <span th:text="${#temporals.format(prescription.prescriptionDate, 'dd/MM/yyyy HH:mm')}">22/07/2026</span>
                </div>
                <span class="badge" th:classappend="${prescription.status == 1 ? 'badge-success' : 'badge-warning'}"
                      th:text="${prescription.status == 1 ? 'Đã cấp phát' : 'Chờ cấp phát'}">Chờ cấp phát</span>
            </div>

            <!-- Danh sách thuốc dạng thẻ (mỗi thuốc 1 khối, xếp dọc — không dùng bảng để tránh bị cắt/tràn ngang) -->
            <div class="prescription-list" id="prescriptionTableBody">

                <th:block th:with="hasDetails = ${prescription != null and prescription.details != null and !#lists.isEmpty(prescription.details)}">

                    <!-- Trường hợp đã có đơn thuốc -->
                    <div th:if="${hasDetails}"
                         th:each="detail, iterStat : ${prescription?.details}" class="prescription-row">

                        <div class="prescription-row-header">
                            <span class="row-badge">Thuốc #<span class="row-index" th:text="${iterStat.count}">1</span></span>
                            <button type="button" class="btn-remove-row" onclick="removePrescriptionRow(this)" title="Xóa thuốc này">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>

                        <div class="prescription-field">
                            <label>Tên thuốc &amp; Mã thuốc <span class="required">*</span></label>
                            <div class="custom-drug-dropdown-wrapper">
                                <input type="hidden" th:name="'items[' + ${iterStat.index} + '].drugId'" th:value="${detail.drug != null ? detail.drug.drugId : ''}" class="drug-id-input" required>
                                <div class="drug-search-box">
                                    <input type="text" class="form-control drug-search-input"
                                           th:value="${detail.drug != null ? '[' + detail.drug.drugCode + '] ' + detail.drug.drugName + (detail.drug.strength != null ? ' - ' + detail.drug.strength + ' ' + detail.drug.strengthUnit : '') : ''}"
                                           placeholder="🔍 Click chọn hoặc tìm mã/tên thuốc..."
                                           onfocus="showDrugDropdown(this)" oninput="filterCustomDrugList(this)" onclick="showDrugDropdown(this)"
                                           autocomplete="off" required>
                                    <i class="fa-solid fa-chevron-down dropdown-arrow-icon"></i>
                                </div>
                                <div class="drug-dropdown-menu">
                                    <div class="drug-option-item" th:each="drug : ${activeDrugs}"
                                         th:data-id="${drug.drugId}" th:data-code="${drug.drugCode}" th:data-name="${drug.drugName}"
                                         th:data-unit="${drug.baseUnit != null ? drug.baseUnit.unitName : 'Đơn vị'}"
                                         th:data-strength="${drug.strength != null ? drug.strength + ' ' + drug.strengthUnit : ''}"
                                         onclick="selectDrugOption(this)">
                                        <div class="drug-option-name"><span th:text="'[' + ${drug.drugCode} + '] ' + ${drug.drugName}">[MÁ] Tên thuốc</span></div>
                                        <div class="drug-option-meta">
                                            <span th:if="${drug.strength != null}" th:text="'Hàm lượng: ' + ${drug.strength} + ' ' + ${drug.strengthUnit}">Hàm lượng</span>
                                            <span th:text="'Đơn vị nhỏ nhất: ' + ${drug.baseUnit != null ? drug.baseUnit.unitName : 'Đơn vị'}">Đơn vị</span>
                                        </div>
                                    </div>
                                    <div class="no-drug-found">Không tìm thấy thuốc phù hợp</div>
                                </div>
                            </div>
                        </div>

                        <div class="prescription-field prescription-field-qty">
                            <label>Số lượng (Đơn vị) <span class="required">*</span></label>
                            <div class="quantity-input-group">
                                <input type="number" th:name="'items[' + ${iterStat.index} + '].quantityPrescribed'" th:value="${detail.quantityPrescribed}"
                                       class="form-control quantity-input" min="1" step="1" placeholder="Số lượng" required>
                                <span class="unit-badge" th:text="${detail.dispenseUnit != null ? detail.dispenseUnit : (detail.drug != null and detail.drug.baseUnit != null ? detail.drug.baseUnit.unitName : 'Đơn vị')}">Viên</span>
                            </div>
                        </div>

                        <div class="prescription-field">
                            <label>Cách sử dụng thuốc <span class="required">*</span></label>
                            <textarea th:name="'items[' + ${iterStat.index} + '].instruction'" th:text="${detail.instruction}"
                                      class="form-control instruction-input" rows="2" placeholder="Ví dụ: Uống 1 viên sau ăn sáng và tối..." required></textarea>
                        </div>
                    </div>

                    <!-- Trường hợp chưa kê đơn -> 1 thẻ trống mặc định -->
                    <div th:unless="${hasDetails}" class="prescription-row">
                        <div class="prescription-row-header">
                            <span class="row-badge">Thuốc #<span class="row-index">1</span></span>
                            <button type="button" class="btn-remove-row" onclick="removePrescriptionRow(this)" title="Xóa thuốc này">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>

                        <div class="prescription-field">
                            <label>Tên thuốc &amp; Mã thuốc <span class="required">*</span></label>
                            <div class="custom-drug-dropdown-wrapper">
                                <input type="hidden" name="items[0].drugId" class="drug-id-input" required>
                                <div class="drug-search-box">
                                    <input type="text" class="form-control drug-search-input"
                                           placeholder="🔍 Click chọn hoặc tìm mã/tên thuốc..."
                                           onfocus="showDrugDropdown(this)" oninput="filterCustomDrugList(this)" onclick="showDrugDropdown(this)"
                                           autocomplete="off" required>
                                    <i class="fa-solid fa-chevron-down dropdown-arrow-icon"></i>
                                </div>
                                <div class="drug-dropdown-menu">
                                    <div class="drug-option-item" th:each="drug : ${activeDrugs}"
                                         th:data-id="${drug.drugId}" th:data-code="${drug.drugCode}" th:data-name="${drug.drugName}"
                                         th:data-unit="${drug.baseUnit != null ? drug.baseUnit.unitName : 'Đơn vị'}"
                                         th:data-strength="${drug.strength != null ? drug.strength + ' ' + drug.strengthUnit : ''}"
                                         onclick="selectDrugOption(this)">
                                        <div class="drug-option-name"><span th:text="'[' + ${drug.drugCode} + '] ' + ${drug.drugName}">[MÁ] Tên thuốc</span></div>
                                        <div class="drug-option-meta">
                                            <span th:if="${drug.strength != null}" th:text="'Hàm lượng: ' + ${drug.strength} + ' ' + ${drug.strengthUnit}">Hàm lượng</span>
                                            <span th:text="'Đơn vị nhỏ nhất: ' + ${drug.baseUnit != null ? drug.baseUnit.unitName : 'Đơn vị'}">Đơn vị</span>
                                        </div>
                                    </div>
                                    <div class="no-drug-found">Không tìm thấy thuốc phù hợp</div>
                                </div>
                            </div>
                        </div>

                        <div class="prescription-field prescription-field-qty">
                            <label>Số lượng (Đơn vị) <span class="required">*</span></label>
                            <div class="quantity-input-group">
                                <input type="number" name="items[0].quantityPrescribed" class="form-control quantity-input" min="1" step="1" placeholder="Số lượng" required>
                                <span class="unit-badge">-</span>
                            </div>
                        </div>

                        <div class="prescription-field">
                            <label>Cách sử dụng thuốc <span class="required">*</span></label>
                            <textarea name="items[0].instruction" class="form-control instruction-input" rows="2" placeholder="Ví dụ: Uống 1 viên sau ăn sáng và tối..." required></textarea>
                        </div>
                    </div>

                </th:block>

            </div>

            <!-- Nút thêm thuốc -->
            <div style="display: flex; justify-content: flex-start;">
                <button type="button" class="btn-add-drug" onclick="addPrescriptionRow()"
                        style="background-color: #f0f9ff; color: #0284c7; border: 1.5px dashed #0284c7; border-radius: 8px; padding: 10px 18px; font-weight: 600; font-size: 0.875rem; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s ease;">
                    <i class="fa-solid fa-plus-circle"></i>
                    <span>Thêm thuốc khác</span>
                </button>
            </div>

            <!-- Ghi chú đơn thuốc -->
            <div class="form-group" style="margin-top: 4px;">
                <label style="font-weight: 600; color: #334155; margin-bottom: 6px; display: block;">
                    Ghi chú đơn thuốc <span class="label-hint" style="font-weight: normal; color: #64748b; font-size: 0.8rem;">(lời dặn thêm cho dược sĩ hoặc bệnh nhân)</span>
                </label>
                <textarea name="notes" class="form-control" rows="2" placeholder="Nhập ghi chú thêm nếu có..."
                          th:text="${prescription != null ? prescription.notes : ''}"></textarea>
            </div>

            <!-- Action Buttons -->
            <div class="form-actions" style="display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 8px;">
                <button type="submit" id="savePrescriptionBtn" class="btn-save-review" style="background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 2px 8px rgba(2, 132, 199, 0.25);">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span th:text="${prescription == null ? 'Lưu đơn thuốc' : 'Cập nhật đơn thuốc'}">Lưu đơn thuốc</span>
                </button>
            </div>

        </div>
    </form>
</div>

</body>
</html>
